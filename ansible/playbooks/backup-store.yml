# Backup store: Garage (S3) on the SSD of backup_store.host (docs/learn/13-ssd-and-backups.md).
#
#   cd ansible && ansible-playbook playbooks/backup-store.yml        (also run by homelab-apply.timer)
#
# Keys are declared in git, encrypted (k8s/secrets/data/backup-s3.sops.yaml for Postgres,
# ansible/secrets/backup-store.sops.yaml for the workstation) and imported into Garage once.
#
# A plain systemd service, not a Kubernetes pod: backups must not depend on the cluster they back up.
# Idempotent: layout, buckets and keys are created once; later runs only check them.
- name: Garage S3 store on the SSD
  hosts: pis
  gather_facts: false
  become: true
  vars:
    garage: /usr/local/bin/garage
  tasks:
    - name: Only the backup store host
      ansible.builtin.meta: end_host
      when: inventory_hostname != backup_store.host

    - name: The SSD is mounted (playbooks/ssd.yml first)
      ansible.builtin.command: findmnt -n {{ ssd.mount }}
      changed_when: false

    - name: System user garage (no login)
      ansible.builtin.user:
        name: garage
        system: true
        shell: /usr/sbin/nologin
        home: /nonexistent
        create_home: false

    - name: Garage {{ garage_version }} binary (sha256 pinned in group_vars)
      ansible.builtin.get_url:
        url: "https://garagehq.deuxfleurs.fr/_releases/{{ garage_version }}/aarch64-unknown-linux-musl/garage"
        dest: "{{ garage }}"
        checksum: "sha256:{{ garage_sha256 }}"
        mode: "0755"
      notify: Restart garage

    - name: Data folders on the SSD (only garage can read them)
      ansible.builtin.file:
        path: "{{ backup_store.data_dir }}/{{ item }}"
        state: directory
        owner: garage
        group: garage
        mode: "0700"
      loop: [meta, data, meta-snapshots]

    - name: RPC secret (made once, kept on this node)
      ansible.builtin.shell:
        cmd: umask 077 && openssl rand -hex 32 > /etc/garage.rpc_secret
        creates: /etc/garage.rpc_secret

    - name: Read the RPC secret
      ansible.builtin.slurp:
        src: /etc/garage.rpc_secret
      register: rpc_secret
      no_log: true

    # /etc/garage.toml is the default path: `sudo garage status` works without -c
    - name: Config /etc/garage.toml
      ansible.builtin.copy:
        dest: /etc/garage.toml
        owner: root
        group: garage
        mode: "0640"
        content: |
          # Managed by ansible/playbooks/backup-store.yml. Single node: replication 1 (the off-site copy
          # to R2 is the second copy). docs/learn/13-ssd-and-backups.md
          metadata_dir = "{{ backup_store.data_dir }}/meta"
          data_dir = "{{ backup_store.data_dir }}/data"
          metadata_snapshots_dir = "{{ backup_store.data_dir }}/meta-snapshots"
          metadata_auto_snapshot_interval = "6h"   # a copy of the index, in case the live one breaks
          db_engine = "lmdb"
          replication_factor = 1
          rpc_bind_addr = "127.0.0.1:3901"
          rpc_public_addr = "127.0.0.1:3901"
          rpc_secret = "{{ rpc_secret.content | b64decode | trim }}"

          [s3_api]
          s3_region = "{{ backup_store.region }}"
          api_bind_addr = "0.0.0.0:{{ backup_store.port }}"

          [admin]
          api_bind_addr = "127.0.0.1:3903"          # /health for checks, this node only
      no_log: true
      notify: Restart garage

    - name: systemd service (starts only with the SSD mounted)
      ansible.builtin.copy:
        dest: /etc/systemd/system/garage.service
        mode: "0644"
        content: |
          [Unit]
          Description=Garage S3 backup store (docs/learn/13-ssd-and-backups.md)
          After=network-online.target
          Wants=network-online.target
          # without the SSD: do not start (never fill the SD card with backups)
          RequiresMountsFor={{ ssd.mount }}
          [Service]
          User=garage
          Group=garage
          ExecStart={{ garage }} server
          Restart=always
          RestartSec=10
          NoNewPrivileges=true
          ProtectSystem=strict
          ProtectHome=true
          PrivateTmp=true
          ReadWritePaths={{ backup_store.data_dir }}
          [Install]
          WantedBy=multi-user.target
      notify: Restart garage

    - name: Flush handlers (start with the current config)
      ansible.builtin.meta: flush_handlers

    - name: Garage running
      ansible.builtin.systemd_service:
        name: garage
        enabled: true
        state: started
        daemon_reload: true

    - name: Wait until it answers
      ansible.builtin.command: "{{ garage }} status"
      register: status
      until: status.rc == 0
      retries: 10
      delay: 3
      changed_when: false

    - name: "Storage layout (once - this node, {{ backup_store.capacity }})"
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          id=$({{ garage }} node id -q | cut -d@ -f1)
          {{ garage }} layout assign -z homelab -c {{ backup_store.capacity }} "$id"
          {{ garage }} layout apply --version 1
        executable: /bin/bash
      when: "'NO ROLE ASSIGNED' in status.stdout"

    - name: Buckets
      ansible.builtin.shell:
        cmd: "{{ garage }} bucket info {{ item.name }} >/dev/null 2>&1 && echo exists || {{ garage }} bucket create {{ item.name }}"
      loop: "{{ backup_store.buckets }}"
      loop_control: { label: "{{ item.name }}" }
      register: buckets
      changed_when: "'exists' not in buckets.stdout"

    # The keys are DECLARED in git, encrypted (docs/learn/13-ssd-and-backups.md):
    #   cnpg-backup -> k8s/secrets/data/backup-s3.sops.yaml (Flux also gives it to Postgres)
    #   workstation -> ansible/secrets/backup-store.sops.yaml
    # Decrypted here on node-workstation (a lookup runs on the machine running Ansible), imported once.
    - name: Keys from git (decrypted on node-workstation)
      ansible.builtin.set_fact:
        store_keys:
          cnpg-backup:
            id: "{{ k8s_keys.stringData.ACCESS_KEY_ID }}"
            secret: "{{ k8s_keys.stringData.ACCESS_SECRET_KEY }}"
          workstation:
            id: "{{ ws_keys.workstation.id }}"
            secret: "{{ ws_keys.workstation.secret }}"
      vars:
        k8s_keys: "{{ lookup('ansible.builtin.pipe', 'sops --decrypt --output-type json ' ~ repo_root ~ '/k8s/secrets/data/backup-s3.sops.yaml') | from_json }}"
        ws_keys: "{{ lookup('ansible.builtin.pipe', 'sops --decrypt --output-type json ' ~ repo_root ~ '/ansible/secrets/backup-store.sops.yaml') | from_json }}"
      no_log: true

    - name: Keys imported once, each with read+write on its own bucket only
      ansible.builtin.shell:
        cmd: |
          if info=$({{ garage }} key info "$KID" --show-secret 2>/dev/null); then
            have=$(printf '%s\n' "$info" | awk -F': *' '/^Secret key:/ {print $2}')
            [ "$have" = "$KSECRET" ] || { echo "MISMATCH"; exit 0; }
          else
            {{ garage }} key import --yes "$KID" "$KSECRET" -n {{ item.key }} >/dev/null && echo imported
          fi
          {{ garage }} bucket allow --read --write --key "$KID" {{ item.name }} >/dev/null && echo allowed
      environment:
        KID: "{{ store_keys[item.key].id }}"
        KSECRET: "{{ store_keys[item.key].secret }}"
      loop: "{{ backup_store.buckets }}"
      loop_control: { label: "{{ item.key }} -> {{ item.name }}" }
      register: keys
      changed_when: "'imported' in keys.stdout"
      failed_when: false
      no_log: true

    # no_log hides the output above (it contains secrets): report the outcome without them
    - name: Keys result
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - "'MISMATCH' not in item.stdout"
          - "'allowed' in item.stdout"
        fail_msg: >-
          key {{ item.item.key }}: {{ 'Garage holds a DIFFERENT secret than git (the id was used before;
          a new key needs a new id in the .sops.yaml file)' if 'MISMATCH' in item.stdout
          else 'import or bucket permission failed (sudo garage key list; sudo garage bucket info ' ~ item.item.name ~ ')' }}
        quiet: true
      loop: "{{ keys.results }}"
      loop_control: { label: "{{ item.item.key }}" }

  handlers:
    - name: Restart garage
      ansible.builtin.systemd_service:
        name: garage
        state: restarted
        daemon_reload: true

# The workstation's key -> rclone settings for the nightly upload (local file, only ops can read it).
- name: Backup store settings on the workstation
  hosts: workstation
  gather_facts: false
  vars:
    store: "{{ hostvars[backup_store.host] }}"
    endpoint: "http://{{ store.static_ip }}:{{ backup_store.port }}"
  tasks:
    - name: rclone settings ({{ backup_store_env }}, mode 600)
      ansible.builtin.copy:
        dest: "{{ backup_store_env }}"
        mode: "0600"
        content: |
          # Backup store (Garage S3 on {{ backup_store.host }}), written by playbooks/backup-store.yml from
          # ansible/secrets/backup-store.sops.yaml. rclone remote "ssd" -> `rclone ls ssd:archives`
          RCLONE_CONFIG_SSD_TYPE=s3
          RCLONE_CONFIG_SSD_PROVIDER=Other
          RCLONE_CONFIG_SSD_ENDPOINT={{ endpoint }}
          RCLONE_CONFIG_SSD_REGION={{ backup_store.region }}
          RCLONE_CONFIG_SSD_FORCE_PATH_STYLE=true
          RCLONE_CONFIG_SSD_ACCESS_KEY_ID={{ store.store_keys.workstation.id }}
          RCLONE_CONFIG_SSD_SECRET_ACCESS_KEY={{ store.store_keys.workstation.secret }}
      no_log: true

    - name: Store answers with the workstation key (list the archives bucket)
      ansible.builtin.shell:
        cmd: set -a; . {{ backup_store_env }}; set +a; rclone lsf ssd:archives >/dev/null && echo ok
      changed_when: false
