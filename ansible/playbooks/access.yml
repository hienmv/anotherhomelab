# Access model for the Pis (K3S-GUIDE section 10.5):
#   - `automation_user` (ops): what Ansible uses. Key only (no password), passwordless sudo, and its
#     key is accepted ONLY from the workstation's IP (authorized_keys from="..."). The key has no
#     passphrase so scheduled jobs can run unattended; it lives only on the workstation.
#   - `admin_user` (ethan): your interactive login (key id_homelab, with passphrase), also accepted
#     ONLY from the workstation's IP. Passwordless sudo on the Pis stays (decision 2026-11-14).
#   - One-off 2026-11-15: the old human account `hien` is renamed to `ethan` (same UID 1000, same
#     home content); Raspberry Pi Connect, which ran under it, is removed.
#   - SSH server: keys only, no root login (Raspberry Pi OS's cloud-init file turned passwords on).
#
# Connects as the automation user (inventory). A brand-new Pi without ops: first run with
#   -e ansible_user=<its first user> -e ansible_ssh_private_key_file=<a key it accepts>
# Idempotent. Run on the workstation as ops (sudo -iu ops):
#   cd ansible && ansible-playbook playbooks/access.yml

- name: Automation key on the workstation
  hosts: workstation
  gather_facts: false
  tasks:
    - name: Key for the automation user (no passphrase, used only from this host)
      community.crypto.openssh_keypair:
        path: "{{ automation_key }}"
        type: ed25519
        comment: "{{ inventory_hostname }}->{{ automation_user }}"
        mode: "0600"

    - name: Read the public key
      ansible.builtin.slurp:
        src: "{{ automation_key }}.pub"
      register: ops_pub

    - name: Read your public key (created by workstation-prepare.yml, in your home)
      ansible.builtin.slurp:
        src: "{{ admin_key }}.pub"
      register: admin_pub
      become: true

    - name: Remember them
      ansible.builtin.set_fact:
        automation_pubkey: "{{ ops_pub.content | b64decode | trim }}"
        admin_pubkey: "{{ admin_pub.content | b64decode | trim }}"

- name: Accounts and SSH hardening on the Pis
  hosts: pis
  become: true
  vars:
    workstation_ip: "{{ hostvars[admin_host].static_ip }}"
    previous_admin_user: hien        # one-off rename 2026-11-15; harmless when it no longer exists
  tasks:
    # ---------- one-off: hien -> ethan (keeps UID 1000 and the home content) ----------
    - name: Does the previous admin account still exist?
      ansible.builtin.command: id -u {{ previous_admin_user }}
      register: previous_admin
      changed_when: false
      failed_when: false

    - name: Rename the previous admin account
      when: previous_admin.rc == 0
      block:
        - name: Stop its background services (linger) and end its sessions
          ansible.builtin.shell: |
            loginctl disable-linger {{ previous_admin_user }} || true
            loginctl terminate-user {{ previous_admin_user }} || true
            sleep 2; pkill -KILL -u {{ previous_admin_user }} || true; sleep 1
            ! pgrep -u {{ previous_admin_user }}

        - name: Rename user, group and home
          ansible.builtin.shell: |
            set -e
            usermod -l {{ admin_user }} -d /home/{{ admin_user }} -m {{ previous_admin_user }}
            groupmod -n {{ admin_user }} {{ previous_admin_user }}
            usermod -c {{ admin_user }} {{ admin_user }}

        - name: Its sudo rule moves to the new name
          ansible.builtin.file:
            path: "/etc/sudoers.d/{{ previous_admin_user }}"
            state: absent

    # ---------- Raspberry Pi Connect: switched off (owner's decision 2026-11-15) ----------
    - name: Raspberry Pi Connect removed
      ansible.builtin.apt:
        name: [rpi-connect, rpi-connect-lite]
        state: absent
        purge: true

    - name: Its leftovers in your home (config with the sign-in key, user service links)
      ansible.builtin.file:
        path: "/home/{{ admin_user }}/{{ item }}"
        state: absent
      loop:
        - .config/com.raspberrypi.connect
        - .config/systemd/user/default.target.wants/rpi-connect.service
        - .config/systemd/user/default.target.wants/rpi-connect-wayvnc.service
        - .config/systemd/user/paths.target.wants/rpi-connect-signin.path

    - name: The first-boot file (cloud-init is off) no longer holds the Connect sign-in key
      ansible.builtin.replace:
        path: /boot/firmware/user-data
        regexp: 'rpuak_[A-Za-z0-9]+'
        replace: 'REMOVED-2026-11-15'

    # ---------- your account ----------
    - name: Your account (fixed UID)
      ansible.builtin.user:
        name: "{{ admin_user }}"
        uid: "{{ admin_uid }}"

    - name: Your passwordless sudo on the Pis (owner's choice 2026-11-14)
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ admin_user }}"
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s

    # usermod refuses to renumber a user with running processes: end leftover ops sessions first
    # (e.g. an SSH ControlPersist connection from an earlier Ansible run).
    - name: Current automation user ID
      ansible.builtin.command: id -u {{ automation_user }}
      register: ops_uid
      changed_when: false
      failed_when: false

    - name: End ops sessions before renumbering
      ansible.builtin.command: pkill -KILL -u {{ automation_user }}
      register: killed
      changed_when: killed.rc == 0
      failed_when: false
      when: ops_uid.rc == 0 and ops_uid.stdout | int != automation_uid

    - name: Automation group (fixed GID)
      ansible.builtin.group:
        name: "{{ automation_user }}"
        gid: "{{ automation_uid }}"

    - name: Automation user (fixed UID, no password, key login only)
      ansible.builtin.user:
        name: "{{ automation_user }}"
        uid: "{{ automation_uid }}"
        group: "{{ automation_user }}"
        comment: homelab automation (Ansible)
        shell: /bin/bash
        password: "!"
        create_home: true

    # groupmod/usermod renumber the account, not files that already belonged to the old group.
    - name: Home folder owned by the automation user and group
      ansible.builtin.file:
        path: "/home/{{ automation_user }}"
        owner: "{{ automation_user }}"
        group: "{{ automation_user }}"
        recurse: true

    - name: Its only key, accepted only from the workstation, no forwarding
      ansible.posix.authorized_key:
        user: "{{ automation_user }}"
        key: "{{ hostvars[admin_host].automation_pubkey }}"
        key_options: 'from="{{ workstation_ip }}",no-agent-forwarding,no-port-forwarding,no-X11-forwarding'
        exclusive: true

    # exclusive: any other key for the admin user on the Pis is removed (only the workstation's).
    - name: Admin user's key, accepted only from the workstation, no forwarding
      ansible.posix.authorized_key:
        user: "{{ admin_user }}"
        key: "{{ hostvars[admin_host].admin_pubkey }}"
        key_options: 'from="{{ workstation_ip }}",no-agent-forwarding,no-port-forwarding,no-X11-forwarding'
        exclusive: true

    - name: Passwordless sudo for the automation user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ automation_user }}"
        content: "{{ automation_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s

    # sshd uses the FIRST value it reads: 10-* wins over cloud-init's 50-cloud-init.conf.
    - name: SSH server - keys only, no root login
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-homelab.conf
        content: |
          # managed by ansible (playbooks/access.yml)
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        mode: "0644"
        validate: sshd -t -f %s
      register: sshd_conf

    - name: Reload sshd
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
      when: sshd_conf is changed

- name: Check the automation user (connects as ops)
  hosts: pis
  gather_facts: false
  tasks:
    - name: Login and passwordless sudo as the automation user
      ansible.builtin.command: sudo -n whoami
      register: ops_sudo
      changed_when: false

    - name: Result
      ansible.builtin.assert:
        that:
          - ops_sudo.stdout == 'root'
        success_msg: "{{ inventory_hostname }}: {{ ansible_user }} can log in and sudo"
        fail_msg: "{{ inventory_hostname }}: sudo as {{ ansible_user }} gave {{ ops_sudo.stdout }}"
