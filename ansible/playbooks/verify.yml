# Read-only health checks for the whole homelab, one tag per layer (catalog: docs/testing.md).
# No sudo, no changes, except the `containers` canary pods, which are created and deleted again.
# Safe any time; run it after every rebuild, migration, k3s/OS upgrade, and when something looks off.
#
#   cd ansible && ansible-playbook playbooks/verify.yml   (as ops: sudo -iu ops)
#   ... --tags nodes,cluster        only some layers
#
# Tags: nodes network cluster containers data apps public backup
# Every check runs; a failing check records a one-line reason in `problems`. At the end each host
# fails once, listing ALL its problems (so one run shows everything). Full log: ansible/logs/.

- name: Nodes (OS, identity, resources)
  hosts: k3s
  gather_facts: true
  tags: [nodes]
  tasks:
    - name: Start with no problems
      ansible.builtin.set_fact: { problems: [] }

    - name: Hostname and IP match the inventory
      ansible.builtin.set_fact:
        problems: "{{ problems + ['identity: hostname ' ~ ansible_facts.hostname ~ ', IPs ' ~ (ansible_facts.all_ipv4_addresses | join(','))] }}"
      when: ansible_facts.hostname != inventory_hostname or static_ip not in ansible_facts.all_ipv4_addresses

    - name: Root disk has at least 15% free
      ansible.builtin.set_fact:
        problems: "{{ problems + ['disk: / has ' ~ ((100 * item.size_available / item.size_total) | round) ~ '% free'] }}"
      loop: "{{ ansible_facts.mounts | selectattr('mount', 'equalto', '/') | list }}"
      loop_control: { label: "{{ item.mount }}" }
      when: (item.size_available / item.size_total) <= 0.15

    # vcgencmd get_throttled bits: 0 under-voltage NOW, 2 throttled now, 3 temperature limit now,
    # 16 under-voltage HAS HAPPENED since boot, 18 throttled since boot, 19 temperature limit since boot.
    # The "since boot" bits catch short dips (2026-11-18: an SSD start dropped node-8gb's voltage for
    # 6 s, invisible to a "now" check); they clear only at a reboot.
    # become: /dev/vcio needs root. Before 2026-11-18 this ran without it, failed, and was skipped.
    - name: Pi power and temperature (vcgencmd get_throttled)
      ansible.builtin.command: vcgencmd get_throttled
      become: true
      register: throttled
      changed_when: false
      failed_when: false
      when: inventory_hostname in groups['pis']

    - name: Power result
      vars:
        bits: "{{ throttled.stdout | default('') | regex_replace('^throttled=', '') }}"
        flags: "{{ (bits | int(base=16)) if bits is match('^0x[0-9a-fA-F]+$') else -1 }}"
        found: >-
          {{ (['cannot read the power state: ' ~ (throttled.stderr | default('') | truncate(80))] if flags | int < 0 else [])
             + (['under-voltage NOW'] if (flags | int >= 0 and (flags | int) // 1 % 2 == 1) else [])
             + (['throttled now'] if (flags | int >= 0 and (flags | int) // 4 % 2 == 1) else [])
             + (['temperature limit now'] if (flags | int >= 0 and (flags | int) // 8 % 2 == 1) else [])
             + (['under-voltage happened since boot'] if (flags | int >= 0 and (flags | int) // 65536 % 2 == 1) else [])
             + (['throttled since boot'] if (flags | int >= 0 and (flags | int) // 262144 % 2 == 1) else [])
             + (['temperature limit since boot'] if (flags | int >= 0 and (flags | int) // 524288 % 2 == 1) else []) }}
      ansible.builtin.set_fact:
        problems: "{{ problems + ['power: ' ~ (found | join(', ')) ~ ' (' ~ throttled.stdout | default('?') ~ '; check the power supply / cooling; since-boot flags clear at a reboot)'] }}"
      when:
        - inventory_hostname in groups['pis']
        - found | length > 0

    # USB SSD (inventory `ssd:`, playbooks/ssd.yml, docs/learn/13-ssd-and-backups.md): mounted, healthy
    # (SMART: failing flash shows as reallocated/pending/uncorrectable sectors; a bad cable as CRC
    # errors), not too full, and the USB link stable (resets = cable, adapter or power).
    - name: USB SSD health
      when: ssd is defined
      become: true
      ansible.builtin.shell:
        cmd: |
          mp={{ ssd.mount | quote }}
          findmnt -n -o SOURCE "$mp" >/dev/null || { echo "{{ ssd.mount }} not mounted (SSD missing? ansible-playbook playbooks/ssd.yml)"; exit 0; }
          used=$(df --output=pcent "$mp" | tail -1 | tr -dc 0-9)
          [ "$used" -lt 80 ] || echo "{{ ssd.mount }} is ${used}% full"
          dev=$(findmnt -n -o SOURCE "$mp" | sed -E 's/[0-9]+$//')
          smart=$(smartctl -H -A -d sat "$dev" 2>&1)
          echo "$smart" | grep -q "overall-health self-assessment test result: PASSED" || echo "SMART health not PASSED on $dev"
          echo "$smart" | awk '$2 ~ /^(Reallocated_Sector_Ct|Current_Pending_Sector|Reported_Uncorrect|Offline_Uncorrectable|UDMA_CRC_Error_Count)$/ && $10 > 0 {print "SMART " $2 " = " $10}'
          resets=$(journalctl -k -b --no-pager 2>/dev/null | grep -cE "usb .*: reset|usb .*: USB disconnect" || true)
          [ "${resets:-0}" -le 2 ] || echo "${resets} USB resets/disconnects since boot (cable, adapter or power)"
      register: ssd_check
      changed_when: false
      failed_when: false

    - name: USB SSD result
      when: ssd is defined
      ansible.builtin.set_fact:
        problems: "{{ problems + ['ssd: ' ~ item] }}"
      loop: "{{ ssd_check.stdout_lines | default([]) }}"

    # Backup store (playbooks/backup-store.yml): Garage running and healthy on its node
    - name: Backup store (Garage)
      when: inventory_hostname == backup_store.host
      become: true
      ansible.builtin.shell:
        cmd: |
          systemctl is-active --quiet garage || { echo "garage service not running (systemctl status garage)"; exit 0; }
          curl -sf -m 5 http://127.0.0.1:3903/health >/dev/null || echo "garage not healthy (curl 127.0.0.1:3903/health)"
      register: store_check
      changed_when: false
      failed_when: false

    - name: Backup store result
      when: inventory_hostname == backup_store.host
      ansible.builtin.set_fact:
        problems: "{{ problems + ['backup-store: ' ~ item] }}"
      loop: "{{ store_check.stdout_lines | default([]) }}"

    # Off-site copy (playbooks/offsite.yml): last successful run < 26 h ago (it is nightly)
    - name: Off-site copy (Cloudflare R2)
      when: inventory_hostname == backup_store.host
      become: true
      ansible.builtin.shell:
        cmd: |
          [ -f /etc/homelab-offsite.env ] || { echo "off-site copy not configured yet (scripts/secrets/set-r2.sh, docs/learn/13 part D)"; exit 0; }
          f=/var/lib/homelab-offsite/last-ok
          [ -f "$f" ] || { echo "off-site copy never succeeded (journalctl -u homelab-offsite)"; exit 0; }
          read -r t rest < "$f"
          age=$(( ($(date +%s) - t) / 3600 ))
          [ "$age" -le 26 ] || echo "last off-site copy ${age} h ago (journalctl -u homelab-offsite)"
      register: offsite_check
      changed_when: false
      failed_when: false

    - name: Off-site result
      when: inventory_hostname == backup_store.host
      ansible.builtin.set_fact:
        problems: "{{ problems + ['offsite: ' ~ item] }}"
      loop: "{{ offsite_check.stdout_lines | default([]) }}"

    - name: Container AppArmor denials since boot (Ubuntu 26.04 bug, K3S-GUIDE 10.3)
      ansible.builtin.shell: journalctl -k -b --no-pager 2>/dev/null | grep 'apparmor="DENIED"' | grep -c cri-containerd || true
      register: aa_denied
      changed_when: false

    - name: AppArmor result
      ansible.builtin.set_fact:
        problems: "{{ problems + ['apparmor: ' ~ aa_denied.stdout ~ ' container denials (journalctl -k -b | grep DENIED)'] }}"
      when: aa_denied.stdout | int > 0

- name: Network (every node reaches every node, the gateway and the internet)
  hosts: k3s
  gather_facts: false
  tags: [network]
  tasks:
    - name: Start with no problems (when run alone)
      ansible.builtin.set_fact: { problems: "{{ problems | default([]) }}" }

    # 10 pings per target: a single ping turns Wi-Fi packet loss (seen 5-10 % on the workstation,
    # 2026-11-13) into a false "unreachable". >= 50 % loss = problem; any loss is reported.
    - name: Ping peers and gateway (packet loss %)
      ansible.builtin.shell: >-
        ping -c 10 -i 0.2 -W 2 -q {{ item }} | sed -nE 's/.* ([0-9.]+)% packet loss.*/\1/p'
      loop: "{{ (groups['k3s'] | map('extract', hostvars, 'static_ip') | list) + [lan_gateway] }}"
      register: pings
      changed_when: false
      failed_when: false

    - name: Packet loss seen
      ansible.builtin.set_fact:
        packet_loss: "{{ pings.results | selectattr('stdout', 'ne', '0') | map(attribute='item') | zip(pings.results | selectattr('stdout', 'ne', '0') | map(attribute='stdout')) | map('join', ' ') | map('regex_replace', '$', '% loss') | list }}"

    - name: Ping result
      ansible.builtin.set_fact:
        problems: "{{ problems + ['network: ' ~ item.item ~ ' ' ~ (item.stdout or '100') ~ '% packet loss'] }}"
      loop: "{{ pings.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: (item.stdout or '100') | float >= 50

    - name: DNS and HTTPS to the internet
      ansible.builtin.command: curl -sS -o /dev/null -w '%{http_code}' https://github.com
      register: inet
      changed_when: false
      failed_when: false

    - name: Internet result
      ansible.builtin.set_fact:
        problems: "{{ problems + ['network: https://github.com -> ' ~ (inet.stdout | default('', true) or inet.stderr | default('no answer', true))] }}"
      when: inet.stdout | default('') != '200'

- name: Cluster, containers, data, apps (kubectl on the workstation)
  hosts: workstation
  gather_facts: false
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  tasks:
    - name: Start with no problems (when run alone)
      tags: [always]
      ansible.builtin.set_fact: { problems: "{{ problems | default([]) }}" }

    # ---------- cluster ----------
    - name: Nodes Ready, names = inventory
      tags: [cluster]
      ansible.builtin.shell: kubectl get nodes --no-headers | awk '{print $1, $2}' | sort
      register: nodes
      changed_when: false
      failed_when: false

    - name: Nodes result
      tags: [cluster]
      vars:
        node_names: "{{ nodes.stdout_lines | map('split') | map('first') | sort }}"
        not_ready: "{{ nodes.stdout_lines | reject('search', ' Ready$') | list }}"
      ansible.builtin.set_fact:
        problems: "{{ problems + ['nodes: ' ~ (nodes.stderr if nodes.rc != 0 else ('not Ready: ' ~ (not_ready | join(', ')) if not_ready else 'names ' ~ (node_names | join(',')) ~ ' != inventory ' ~ (groups['k3s'] | sort | join(','))))] }}"
      when: nodes.rc != 0 or not_ready | length > 0 or node_names != (groups['k3s'] | sort)

    - name: Flux Kustomizations and HelmReleases that are not Ready
      tags: [cluster]
      ansible.builtin.shell: >-
        kubectl get kustomizations.kustomize.toolkit.fluxcd.io,helmreleases.helm.toolkit.fluxcd.io -A -o json
        | jq -r '.items[] | (.status.conditions // [] | map(select(.type == "Ready")) | first) as $r
        | select(($r.status // "Unknown") != "True") | "\(.kind)/\(.metadata.name): \($r.message // "no status")"'
      register: flux
      # Right after a merge Flux applies the chain step by step (each waits for the one before:
      # "dependency ... revision is not up to date"), ~1-2 min. A snapshot then is a false alarm, so
      # wait up to 3 min for everything to settle; only what is still not Ready is a problem.
      until: flux.stdout | length == 0
      retries: 12
      delay: 15
      changed_when: false
      failed_when: false

    - name: Flux result
      tags: [cluster]
      ansible.builtin.set_fact:
        problems: "{{ problems + ['flux: ' ~ (item | truncate(200))] }}"
      loop: "{{ flux.stdout_lines + ([flux.stderr] if flux.rc != 0 else []) }}"

    - name: Pods not Running/Succeeded (pods being deleted are ignored)
      tags: [cluster]
      ansible.builtin.shell: >-
        kubectl get pods -A -o json | jq -r '.items[] | select(.metadata.deletionTimestamp == null)
        | select(.status.phase != "Running" and .status.phase != "Succeeded")
        | "\(.metadata.namespace)/\(.metadata.name) \(.status.phase)"'
      register: bad_pods
      changed_when: false
      failed_when: false

    - name: Pods result
      tags: [cluster]
      ansible.builtin.set_fact:
        problems: "{{ problems + ['pod: ' ~ item] }}"
      loop: "{{ bad_pods.stdout_lines }}"

    # Every ${KEY} of site-settings must be filled in by Flux; a raw one in the cluster = broken config.
    - name: Unreplaced site variables in live objects
      tags: [cluster]
      ansible.builtin.shell: |
        keys=$(kubectl -n flux-system get configmap site-settings -o json | jq -r '.data | keys | join("|")')
        kubectl get deploy,statefulset,daemonset,ingress,service,configmap,middleware.traefik.io -A -o yaml \
          | grep -oE '\$\{('"$keys"')\}' | sort | uniq -c || true
      register: unreplaced
      changed_when: false
      failed_when: false

    - name: Unreplaced result
      tags: [cluster]
      ansible.builtin.set_fact:
        problems: "{{ problems + ['config: unreplaced ' ~ (unreplaced.stdout_lines | map('trim') | join(', ')) ~ ' (Flux substitution)'] }}"
      when: unreplaced.stdout | length > 0

    - name: Data pods on the role=data node
      tags: [cluster, data]
      ansible.builtin.shell: |
        want=$(kubectl get nodes -l role=data -o name | sed 's#node/##')
        kubectl -n data get pods -o custom-columns=N:.metadata.name,NODE:.spec.nodeName --no-headers | awk -v w="$want" '$2 != w'
      register: misplaced
      changed_when: false
      failed_when: false

    - name: Data placement result
      tags: [cluster, data]
      ansible.builtin.set_fact:
        problems: "{{ problems + ['data: ' ~ item ~ ' (not on the role=data node)'] }}"
      loop: "{{ misplaced.stdout_lines }}"

    # ---------- containers: canary Postgres on every schedulable node ----------
    - name: Container canary
      tags: [containers]
      block:
        - name: Canary pods (Postgres start + checkpoint + reload = signals work)
          ansible.builtin.shell: |
            set -e
            # leftovers from an earlier run must be gone first ("object is being deleted")
            kubectl -n default delete pod -l app=verify-canary --wait=true --timeout=120s >/dev/null 2>&1 || true
            for n in $(kubectl get nodes -o json | jq -r '.items[] | select([.spec.taints[]? | select(.effect=="NoSchedule")] | length == 0) | .metadata.name'); do
              cat <<EOF | kubectl apply -f - >/dev/null
            apiVersion: v1
            kind: Pod
            metadata: { name: canary-pg-$n, namespace: default, labels: { app: verify-canary } }
            spec:
              nodeSelector: { kubernetes.io/hostname: $n }
              containers:
              - name: pg
                image: postgres:17
                env: [{ name: POSTGRES_PASSWORD, value: canary }]
                resources: { limits: { memory: 256Mi } }
                readinessProbe:
                  exec: { command: [pg_isready, -U, postgres, -h, 127.0.0.1] }
                  periodSeconds: 3
            EOF
            done
            # nodes may still be pulling images right after a deploy: allow 6 min
            if ! kubectl -n default wait pod -l app=verify-canary --for=condition=Ready --timeout=360s >/dev/null; then
              kubectl -n default get pod -l app=verify-canary -o json | jq -r '.items[]
                | select((.status.containerStatuses // [{}])[0].ready != true)
                | "NOTREADY \(.metadata.name) on \(.spec.nodeName): \((.status.containerStatuses // [{}])[0].state.waiting.reason // .status.phase)"'
              exit 0
            fi
            for p in $(kubectl -n default get pod -l app=verify-canary -o name); do
              kubectl -n default exec "$p" -- psql -U postgres -Atc "checkpoint; select pg_reload_conf();" >/dev/null 2>&1 \
                && echo "OK $p" || echo "FAILED $p (checkpoint/reload)"
            done
          register: canary
          changed_when: false
          failed_when: false

        - name: Canary result
          ansible.builtin.set_fact:
            problems: "{{ problems + ['canary: ' ~ item] }}"
          loop: "{{ (canary.stdout_lines | reject('match', '^OK ') | list) + ([canary.stderr | truncate(200)] if canary.rc != 0 else []) }}"
      always:
        - name: Delete canary pods
          ansible.builtin.command: kubectl -n default delete pod -l app=verify-canary --wait=false
          changed_when: false
          failed_when: false

    # ---------- data ----------
    - name: Postgres healthy, row counts
      tags: [data]
      ansible.builtin.shell: |
        set -e
        phase=$(kubectl -n data get cluster.postgresql.cnpg.io pg -o jsonpath='{.status.phase}')
        [ "$phase" = "Cluster in healthy state" ] || { echo "PHASE $phase"; exit 1; }
        pod=$(kubectl -n data get pod -l cnpg.io/cluster=pg,cnpg.io/instanceRole=primary -o name | head -1)
        kubectl -n data exec "$pod" -c postgres -- psql -U postgres -d app -Atc \
          "select relname || ' ' || n_live_tup from pg_stat_user_tables order by 1"
      register: pg_rows
      changed_when: false
      failed_when: false

    - name: Postgres result
      tags: [data]
      ansible.builtin.set_fact:
        problems: "{{ problems + ['postgres: ' ~ ((pg_rows.stdout_lines | select('match', '^PHASE') | first | default('', true)) or (pg_rows.stderr | truncate(200)))] }}"
      when: pg_rows.rc != 0

    # Postgres continuous backup (k8s/data/objectstore.yaml, docs/learn/13-ssd-and-backups.md part C):
    # WAL archiving works (CNPG condition) and the newest base backup is < 26 h old (nightly)
    - name: Postgres continuous backup (WAL archiving, newest base backup)
      tags: [data, backup]
      ansible.builtin.shell:
        cmd: |
          arch=$(kubectl -n data get cluster.postgresql.cnpg.io pg -o jsonpath='{.status.conditions[?(@.type=="ContinuousArchiving")].status} {.status.conditions[?(@.type=="ContinuousArchiving")].message}' 2>&1)
          case "$arch" in True*) ;; *) echo "WAL archiving not working: $(echo "$arch" | cut -c1-160)";; esac
          newest=$(kubectl -n data get backups.postgresql.cnpg.io -o json 2>/dev/null \
            | jq -r '[.items[] | select(.status.phase == "completed") | .status.stoppedAt] | max // empty')
          if [ -z "$newest" ]; then echo "no completed base backup yet (kubectl -n data get backups)"; exit 0; fi
          age=$(( ($(date +%s) - $(date -d "$newest" +%s)) / 3600 ))
          [ "$age" -le 26 ] || echo "newest base backup is ${age} h old ($newest): kubectl -n data get backups"
      register: pg_backup
      changed_when: false
      failed_when: false

    - name: Postgres backup result
      tags: [data, backup]
      ansible.builtin.set_fact:
        problems: "{{ problems + ['pg-backup: ' ~ item] }}"
      loop: "{{ pg_backup.stdout_lines }}"

    - name: Redis answers PING
      tags: [data]
      ansible.builtin.shell: |
        pw=$(kubectl -n data get secret redis -o jsonpath='{.data.password}' | base64 -d)
        kubectl -n data exec redis-0 -- sh -c "REDISCLI_AUTH='$pw' redis-cli ping"
      register: redis_ping
      changed_when: false
      failed_when: false
      no_log: true

    - name: Redis result
      tags: [data]
      ansible.builtin.set_fact:
        problems: "{{ problems + ['redis: PING did not answer PONG'] }}"
      when: redis_ping.stdout | default('') != 'PONG'

    # ---------- apps ----------
    - name: App deployments not fully available
      tags: [apps]
      ansible.builtin.shell: |
        kubectl -n apps get deploy --no-headers -o custom-columns=N:.metadata.name,W:.spec.replicas,A:.status.availableReplicas \
          | awk '$2!=$3 {print $1 " " $3 "/" $2 " available"}'
      register: deploys
      changed_when: false
      failed_when: false

    - name: Deployments result
      tags: [apps]
      ansible.builtin.set_fact:
        problems: "{{ problems + ['deployment: ' ~ item] }}"
      loop: "{{ deploys.stdout_lines }}"

    # Central logs: a collector (vlagent) on every node, and VictoriaLogs received lines recently.
    - name: Central logs (collector on every node, lines in the last 15 min)
      tags: [apps]
      ansible.builtin.shell: |
        nodes=$(kubectl get nodes --no-headers | wc -l)
        ready=$(kubectl -n monitoring get ds -l app.kubernetes.io/name=vlagent -o jsonpath='{.items[0].status.numberReady}' 2>/dev/null)
        [ "${ready:-0}" -ge "$nodes" ] || echo "log collector (vlagent) ready on ${ready:-0} of $nodes nodes"
        svc=$(kubectl -n monitoring get svc -l app.kubernetes.io/name=vlsingle -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
        [ -n "$svc" ] || { echo "VictoriaLogs service not found"; exit 0; }
        # LogsQL: _time:15m | stats count() rows   ->   {"rows":"12345"}
        out=$(kubectl get --raw "/api/v1/namespaces/monitoring/services/$svc:9428/proxy/select/logsql/query?query=_time%3A15m%20%7C%20stats%20count()%20rows" 2>&1)
        rows=$(printf '%s' "$out" | grep -oE '"rows":"?[0-9]+' | grep -oE '[0-9]+$')
        [ "${rows:-0}" -gt 0 ] || echo "VictoriaLogs received no log lines in 15 min ($(printf '%s' "$out" | head -c 120))"
      register: central_logs
      changed_when: false
      failed_when: false

    - name: Central logs result
      tags: [apps]
      ansible.builtin.set_fact:
        problems: "{{ problems + ['logs: ' ~ item] }}"
      loop: "{{ central_logs.stdout_lines }}"

    # Host logs (docs/design/2026-11-21-host-logs.md): every machine in the inventory sent journal lines
    # to VictoriaLogs in the last 15 min (a machine going quiet is itself a warning sign)
    - name: Host logs arriving from every machine
      tags: [apps]
      ansible.builtin.shell:
        cmd: |
          svc=$(kubectl -n monitoring get svc -l app.kubernetes.io/name=vlsingle -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
          [ -n "$svc" ] || exit 0
          # LogsQL: _time:15m _HOSTNAME:* | stats by (_HOSTNAME) count() lines   (one JSON line per host)
          seen=$(kubectl get --raw "/api/v1/namespaces/monitoring/services/$svc:9428/proxy/select/logsql/query?query=_time%3A15m%20_HOSTNAME%3A*%20%7C%20stats%20by%20(_HOSTNAME)%20count()%20lines" 2>/dev/null \
            | grep -oE '"_HOSTNAME":"[^"]+"' | cut -d'"' -f4)
          for h in {{ groups['k3s'] | join(' ') }}; do
            printf '%s\n' "$seen" | grep -qx "$h" || echo "no host log lines from $h in 15 min (ssh $h systemctl status systemd-journal-upload)"
          done
      register: host_logs
      changed_when: false
      failed_when: false

    - name: Host logs result
      tags: [apps]
      ansible.builtin.set_fact:
        problems: "{{ problems + ['logs: ' ~ item] }}"
      loop: "{{ host_logs.stdout_lines }}"

    # Traces: make ONE real request, then find its trace in VictoriaTraces (proves agent -> collector ->
    # store end to end). Needed because idle traffic is filtered out: "no traces" alone proves nothing.
    # Takes ~20 s (agent batch 5 s + collector decision 10 s + batch 5 s).
    - name: Tracing pipeline (one test request, then its trace)
      tags: [apps]
      ansible.builtin.shell: |
        vt=$(kubectl -n monitoring get svc -l app.kubernetes.io/name=vtsingle -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
        [ -n "$vt" ] || { echo "VictoriaTraces service not found"; exit 0; }
        start=$(( $(date +%s) * 1000000 ))
        kubectl get --raw /api/v1/namespaces/apps/services/ticketlite-api:80/proxy/api/concerts >/dev/null 2>&1 \
          || { echo "test request to ticketlite-api failed"; exit 0; }
        for i in $(seq 1 9); do
          sleep 5
          now=$(( $(date +%s) * 1000000 ))
          n=$(kubectl get --raw "/api/v1/namespaces/monitoring/services/$vt:10428/proxy/select/jaeger/api/traces?service=ticketlite-api&operation=GET%20%2Fapi%2Fconcerts&limit=5&start=$start&end=$now" 2>/dev/null | grep -o '"traceID"' | wc -l)
          [ "$n" -gt 0 ] && exit 0
        done
        echo "the trace of a test request did not reach VictoriaTraces within 45 s (ticketlite agent -> otel-collector -> VictoriaTraces)"
      register: tracing
      changed_when: false
      failed_when: false

    - name: Tracing result
      tags: [apps]
      ansible.builtin.set_fact:
        problems: "{{ problems + ['traces: ' ~ item] }}"
      loop: "{{ tracing.stdout_lines }}"

    # SLOs (docs/learn/11-slo.md): the measurement works (Traefik metrics arrive), Alertmanager has its
    # config, and which SLO alerts fire right now (Telegram gets them too, this is the second channel).
    - name: SLOs (Traefik metrics arriving, Alertmanager config, firing SLO alerts)
      tags: [apps]
      # cmd: form: Ansible does not try to split this text into its own key=value options (the
      # free form failed on it: "failed at splitting arguments", 2026-11-18)
      ansible.builtin.shell:
        cmd: |
          q() { kubectl get --raw "/api/v1/namespaces/monitoring/services/vmsingle-vm-victoria-metrics-k8s-stack:8428/proxy/api/v1/query?query=$1" 2>&1; }
          n=$(q 'count(traefik_service_requests_total)' | grep -oE '"value":\[[^,]+,"[0-9]+' | grep -oE '[0-9]+$')
          [ "${n:-0}" -gt 0 ] || echo "no Traefik request metrics in VictoriaMetrics: SLOs cannot be measured (VMPodScrape traefik, Traefik metrics port)"
          kubectl -n monitoring get secret alertmanager-config >/dev/null 2>&1 \
            || echo "Secret monitoring/alertmanager-config missing: playbooks/alerting.yml writes it into k8s/secrets (commit + PR)"
          # GitOps secrets (docs/learn/12): Flux's decryption key present
          kubectl -n flux-system get secret sops-age >/dev/null 2>&1 \
            || echo "Secret flux-system/sops-age missing: Flux cannot decrypt k8s/secrets (scripts/secrets/bootstrap.sh or restore.yml)"
          # ALERTS{alertstate="firing",slo!=""} -> one line per alert: name site slo window
          q 'ALERTS%7Balertstate%3D%22firing%22%2Cslo!%3D%22%22%7D' | python3 -c '
          import json, sys
          for r in json.load(sys.stdin).get("data", {}).get("result", []):
              m = r["metric"]
              # only the labels an alert has: SLO alerts (site, window), backup alerts (backup)
              what = " ".join(v for v in (m.get("site"), m.get("backup"), m.get("slo")) if v)
              print("firing: %s %s%s" % (m.get("alertname"), what, " (%s)" % m["window"] if m.get("window") else ""))
          ' 2>/dev/null
      register: slo
      changed_when: false
      failed_when: false

    - name: SLO result
      tags: [apps]
      ansible.builtin.set_fact:
        problems: "{{ problems + ['slo: ' ~ item] }}"
      loop: "{{ slo.stdout_lines }}"

    # 2-copy deployments only survive a node failure if the copies sit on different nodes. The
    # spread is soft, so after a node outage both copies can stay on one node until a restart.
    - name: 2-copy deployments with all copies on one node
      tags: [apps]
      ansible.builtin.shell: |
        for d in apps/landing apps/notes apps/ticketlite-web apps/ticketlite-api infra/cloudflared kube-system/traefik; do
          ns=${d%/*}; name=${d#*/}
          # matchLabels as JSON {"k":"v",...} -> k=v,... (a label selector)
          sel=$(kubectl -n "$ns" get deploy "$name" -o jsonpath='{.spec.selector.matchLabels}' 2>/dev/null | tr -d '{}"' | tr ':' '=')
          [ -n "$sel" ] || { echo "$d: deployment not found"; continue; }
          nodes=$(kubectl -n "$ns" get pods -l "$sel" --field-selector=status.phase=Running -o jsonpath='{.items[*].spec.nodeName}' | tr ' ' '\n' | sort -u | grep -c .)
          [ "$nodes" -ge 2 ] || echo "$d: all copies on one node (fix: kubectl -n $ns rollout restart deploy/$name)"
        done
      register: spread
      changed_when: false
      failed_when: false

    - name: Spread result
      tags: [apps]
      ansible.builtin.set_fact:
        problems: "{{ problems + ['spread: ' ~ item] }}"
      loop: "{{ spread.stdout_lines }}"

    - name: grafana.lan answers with a trusted certificate (LAN name, private CA)
      tags: [apps]
      ansible.builtin.command: curl -sS -o /dev/null -w '%{http_code} %{ssl_verify_result}' https://grafana.lan
      register: lan_grafana
      changed_when: false
      failed_when: false

    - name: grafana.lan result
      tags: [apps]
      ansible.builtin.set_fact:
        problems: "{{ problems + ['grafana.lan: ' ~ ((lan_grafana.stdout ~ ' ' ~ lan_grafana.stderr) | trim) ~ ' (want: 302 0)'] }}"
      when: lan_grafana.stdout != '302 0'

    # ---------- backup ----------
    - name: Newest backup age (hours) and decryptable
      tags: [backup]
      ansible.builtin.shell: |
        set -e
        f=$(ls -t {{ backup_dir }}/{{ cluster_name }}-*.tar.gz.age | head -1)
        age -d -i {{ age_key }} "$f" | tar -tzf - >/dev/null
        echo "$(( ($(date +%s) - $(stat -c %Y "$f")) / 3600 )) $(basename "$f")"
      register: backup_age
      changed_when: false
      failed_when: false

    - name: Backup result
      tags: [backup]
      ansible.builtin.set_fact:
        problems: "{{ problems + ['backup: ' ~ ((backup_age.stderr | truncate(200)) if backup_age.rc != 0 else ('newest is ' ~ backup_age.stdout.split()[0] ~ ' h old (' ~ backup_age.stdout.split()[1] ~ '): nightly backup failed? journalctl -u homelab-backup'))] }}"
      when: backup_age.rc != 0 or (backup_age.stdout.split()[0] | int) > 26   # nightly (homelab-backup.timer)

    - name: Newest archive also in the backup store (SSD), under 26 h old
      tags: [backup]
      ansible.builtin.shell:
        cmd: |
          [ -f {{ backup_store_env | quote }} ] || { echo "no backup store configured (playbooks/backup-store.yml)"; exit 0; }
          set -a; . {{ backup_store_env | quote }}; set +a
          # stdout only: rclone prints notices on stderr ("Config file ... not found - using defaults"),
          # which once counted as "files found" (2026-11-18): only real file names may pass this check
          err=$(mktemp); trap 'rm -f "$err"' EXIT
          out=$(rclone lsf --max-age 26h --files-only ssd:archives 2>"$err") \
            || { echo "store unreachable: $(tail -1 "$err" | cut -c1-120)"; exit 0; }
          printf '%s\n' "$out" | grep -q '\.tar\.gz\.age$' \
            || echo "no archive younger than 26 h in ssd:archives (nightly upload failed? journalctl -u homelab-backup)"
      register: store_copy
      changed_when: false
      failed_when: false

    - name: Store copy result
      tags: [backup]
      ansible.builtin.set_fact:
        problems: "{{ problems + ['backup: ' ~ item] }}"
      loop: "{{ store_copy.stdout_lines }}"

    # Host GitOps (files/homelab-apply.sh): last run succeeded and is recent (it re-applies every 6 h)
    - name: Host apply healthy
      tags: [cluster]
      ansible.builtin.shell:
        cmd: |
          f={{ automation_home }}/.local/state/homelab/apply.state
          [ -f "$f" ] || { echo "host apply never ran (systemctl list-timers homelab-apply)"; exit 0; }
          read -r commit last status _ < "$f"
          [ "$status" = ok ] || echo "host apply FAILING at $commit (less ~/.local/state/homelab/last-apply.log)"
          [ $(( $(date +%s) - last )) -lt 25200 ] || echo "host apply has not run for $(( ($(date +%s) - last) / 3600 )) h (timer stopped?)"
      register: apply_check
      changed_when: false
      failed_when: false

    - name: Host apply result
      tags: [cluster]
      ansible.builtin.set_fact:
        problems: "{{ problems + ['gitops: ' ~ item] }}"
      loop: "{{ apply_check.stdout_lines }}"

    # ---------- expiry dates (nothing else warns about these) ----------
    - name: Expiry dates from group_vars (days left)
      tags: [apps]
      vars:
        days_left: "{{ ((item.date | to_datetime('%Y-%m-%d')) - now()).days }}"
      ansible.builtin.set_fact:
        problems: "{{ problems + ['expiry: ' ~ item.name ~ ' expires ' ~ item.date ~ ' (' ~ days_left ~ ' days left)'] }}"
      loop: "{{ expiry_dates | default([]) }}"
      loop_control: { label: "{{ item.name }}" }
      when: days_left | int < expiry_warn_days | int

    - name: grafana.lan certificate (days left)
      tags: [apps]
      ansible.builtin.shell: >-
        end=$(kubectl -n monitoring get secret grafana-lan-tls -o jsonpath='{.data.tls\.crt}' | base64 -d
        | openssl x509 -noout -enddate | cut -d= -f2) && echo $(( ($(date -d "$end" +%s) - $(date +%s)) / 86400 ))
      register: lan_cert_days
      changed_when: false
      failed_when: false

    - name: grafana.lan certificate result
      tags: [apps]
      ansible.builtin.set_fact:
        problems: "{{ problems + ['expiry: grafana.lan certificate ' ~ ('unreadable: ' ~ (lan_cert_days.stderr | truncate(120)) if lan_cert_days.rc != 0 else 'expires in ' ~ lan_cert_days.stdout ~ ' days (new CA + cert: K3S-GUIDE section 7)')] }}"
      when: lan_cert_days.rc != 0 or lan_cert_days.stdout | int < expiry_warn_days | int

- name: Public entry points (Cloudflare, from the machine running Ansible)
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [public]
  tasks:
    - name: Start with no problems
      ansible.builtin.set_fact: { problems: [] }

    - name: Public URLs
      ansible.builtin.uri:
        url: "{{ item }}"
        status_code: 200
      loop: "{{ public_urls }}"
      register: urls
      failed_when: false

    - name: Public URL result
      ansible.builtin.set_fact:
        problems: "{{ problems + ['public: ' ~ item.item ~ ' -> ' ~ (item.status | default('no answer')) ~ ' (want 200)'] }}"
      loop: "{{ urls.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: item.status | default(0) != 200

    - name: Grafana behind Cloudflare Access
      ansible.builtin.uri:
        url: "https://grafana.{{ site.DOMAIN }}"
        follow_redirects: none
        status_code: [302]
      register: grafana
      failed_when: false

    - name: Grafana result
      ansible.builtin.set_fact:
        problems: "{{ problems + ['public: grafana.' ~ site.DOMAIN ~ ' not behind Cloudflare Access (' ~ (grafana.status | default('no answer')) ~ ' ' ~ (grafana.location | default('')) ~ ')'] }}"
      when: "'cloudflareaccess.com' not in (grafana.location | default(''))"

    - name: Unknown subdomain redirects to the landing page
      ansible.builtin.uri:
        url: "https://does-not-exist.{{ site.DOMAIN }}"
        follow_redirects: none
        status_code: [301, 302, 308]
      register: fallback
      failed_when: false

    - name: Fallback result
      ansible.builtin.set_fact:
        problems: "{{ problems + ['public: unknown subdomain -> ' ~ (fallback.status | default('no answer')) ~ ' (want a redirect)'] }}"
      when: fallback.status | default(0) not in [301, 302, 308]

- name: Result
  hosts: k3s:localhost
  gather_facts: false
  tags: [always]
  tasks:
    - name: Summary (workstation)
      ansible.builtin.debug:
        msg:
          - "nodes: {{ nodes.stdout_lines | default(['not run']) }}"
          - "canary: {{ canary.stdout_lines | default(['not run']) }}"
          - "postgres rows: {{ pg_rows.stdout_lines | default(['not run']) }}"
          - "backup: {{ backup_age.stdout | default('not run') }}"
      when: inventory_hostname in groups['workstation']

    - name: Packet loss (reported, not a failure below 50 %)
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ packet_loss | join(', ') }}"
      when: packet_loss | default([]) | length > 0

    - name: All checks passed
      ansible.builtin.assert:
        that: problems | default([]) | length == 0
        fail_msg: "{{ problems | length }} problem(s) on {{ inventory_hostname }}: {{ problems | join(' | ') }}"
        success_msg: "{{ inventory_hostname }}: all checks passed"
