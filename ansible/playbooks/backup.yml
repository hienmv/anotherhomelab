# Phase 1 (K3S-GUIDE section 10) and any manual backup later: export the hand-made Secrets and
# dump PostgreSQL, encrypted with the workstation's age key. No downtime, no sudo, read-only on the cluster.
#
#   cd ansible && ansible-playbook playbooks/backup.yml   (as ops: sudo -iu ops)
#
# Result: <backup_dir>/<cluster_name>-<date>.tar.gz.age on the workstation (paths: group_vars/all.yml),
# plus a copy in ~/<cluster_name>-backups/ on the machine running Ansible when that is another machine.
# Restore: age -d -i <age_key> <file> | tar -xzf - -C <dir>

- name: Backup secrets and PostgreSQL
  hosts: workstation
  gather_facts: false
  vars:
    # Secrets created by hand (K3S-GUIDE → Secrets) + pg-app, whose password app-env's DATABASE_URL uses.
    hand_secrets:
      - flux-system/flux-system
      - infra/tunnel-creds
      - data/pg-app
      - data/redis
      - apps/app-env
      - apps/ticketlite
      - apps/ghcr-pull
      - monitoring/grafana-admin
      - monitoring/grafana-lan-tls
  tasks:
    - name: age key directory
      ansible.builtin.file:
        path: "{{ age_key | dirname }}"
        state: directory
        mode: "0700"

    # Same key SOPS will use later (standard path). Lose it = backups unreadable: copy it to a
    # password manager.
    - name: age key for backups and SOPS
      ansible.builtin.command:
        cmd: age-keygen -o {{ age_key }}
        creates: "{{ age_key }}"
      register: age_new

    - name: age public key (recipient)
      ansible.builtin.command: age-keygen -y {{ age_key }}
      register: age_pub
      changed_when: false

    - name: Run backup
      ansible.builtin.script:
        cmd: >-
          ../files/backup.sh {{ backup_dir }} {{ cluster_name }} {{ kubeconfig }} {{ age_key }} {{ age_pub.stdout }}
          {{ hand_secrets | join(' ') }}
      register: backup
      changed_when: true

    - name: Summary
      ansible.builtin.debug:
        msg: "{{ backup.stdout_lines | reject('match', '^BACKUP_FILE=') | list }}"

    - name: Copy the encrypted backup to the machine running Ansible (second copy)
      ansible.builtin.fetch:
        src: "{{ backup.stdout_lines | select('match', '^BACKUP_FILE=') | first | regex_replace('^BACKUP_FILE=', '') }}"
        dest: "~/{{ cluster_name }}-backups/"
        flat: true
      when: ansible_connection != 'local'

    - name: New age key - save it now
      ansible.builtin.debug:
        msg: >-
          A new age key was created at {{ age_key }} on {{ inventory_hostname }}. Without it the backup cannot be
          decrypted. Copy the whole file into your password manager now (there: cat {{ age_key }}).
      when: age_new.changed
