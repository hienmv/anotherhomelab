# Phase 1 (K3S-GUIDE section 10) and any manual backup later: export the hand-made Secrets and
# dump PostgreSQL, encrypted with the workstation's age key. No downtime, no sudo, read-only on the cluster.
#
#   cd ansible && ansible-playbook playbooks/backup.yml   (as ops: sudo -iu ops)
#
# Result: <backup_dir>/<cluster_name>-<date>.tar.gz.age on the workstation (paths: group_vars/all.yml),
# plus a copy in ~/<cluster_name>-backups/ on the machine running Ansible when that is another machine.
# Restore: age -d -i <age_key> <file> | tar -xzf - -C <dir>

- name: Backup secrets and PostgreSQL
  hosts: workstation
  gather_facts: false
  vars:
    # Secrets created by hand (K3S-GUIDE → Secrets) + pg-app, whose password app-env's DATABASE_URL uses.
    hand_secrets:
      - flux-system/flux-system
      - infra/tunnel-creds
      - data/pg-app
      - data/redis
      - apps/app-env
      - apps/ticketlite
      - apps/ghcr-pull
      - monitoring/grafana-admin
      - monitoring/grafana-lan-tls
  tasks:
    - name: age key directory
      ansible.builtin.file:
        path: "{{ age_key | dirname }}"
        state: directory
        mode: "0700"

    # Same key SOPS will use later (standard path). Lose it = backups unreadable: copy it to a
    # password manager.
    - name: age key for backups and SOPS
      ansible.builtin.command:
        cmd: age-keygen -o {{ age_key }}
        creates: "{{ age_key }}"
      register: age_new

    - name: age public key (recipient)
      ansible.builtin.command: age-keygen -y {{ age_key }}
      register: age_pub
      changed_when: false

    - name: Run backup
      ansible.builtin.script:
        cmd: >-
          ../files/backup.sh {{ backup_dir }} {{ cluster_name }} {{ kubeconfig }} {{ age_key }} {{ age_pub.stdout }}
          {{ hand_secrets | join(' ') }}
      register: backup
      changed_when: true

    - name: Summary
      ansible.builtin.debug:
        msg: "{{ backup.stdout_lines | reject('match', '^BACKUP_FILE=') | list }}"

    # Second copy on another machine: the S3 store on node-8gb's SSD (playbooks/backup-store.yml,
    # docs/learn/13-ssd-and-backups.md). The archive is already age-encrypted.
    - name: Backup store settings present?
      ansible.builtin.stat:
        path: "{{ backup_store_env }}"
      register: store_env

    - name: Copy to the backup store (bucket archives) and drop copies older than {{ backup_keep_days }} days
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          set -a; . {{ backup_store_env | quote }}; set +a
          f={{ backup.stdout_lines | select('match', '^BACKUP_FILE=') | first | regex_replace('^BACKUP_FILE=', '') | quote }}
          rclone copyto "$f" "ssd:archives/$(basename "$f")"
          rclone lsf "ssd:archives/$(basename "$f")" | grep -q . || { echo "upload not found in the store" >&2; exit 1; }
          rclone delete --min-age {{ backup_keep_days }}d ssd:archives
          echo "stored ssd:archives/$(basename "$f")"
        executable: /bin/bash
      register: stored
      when: store_env.stat.exists

    - name: Store result
      ansible.builtin.debug:
        msg: "{{ stored.stdout | default('no backup store configured yet (playbooks/backup-store.yml): archive kept locally only') }}"

    - name: Local archives older than {{ backup_keep_days }} days removed (the store keeps its own copies)
      ansible.builtin.shell:
        cmd: find {{ backup_dir | quote }} -maxdepth 1 -name '{{ cluster_name }}-*.tar.gz.age' -mtime +{{ backup_keep_days }} -print -delete
      register: pruned
      changed_when: pruned.stdout | length > 0

    - name: Copy the encrypted backup to the machine running Ansible (second copy)
      ansible.builtin.fetch:
        src: "{{ backup.stdout_lines | select('match', '^BACKUP_FILE=') | first | regex_replace('^BACKUP_FILE=', '') }}"
        dest: "~/{{ cluster_name }}-backups/"
        flat: true
      when: ansible_connection != 'local'

    - name: New age key - save it now
      ansible.builtin.debug:
        msg: >-
          A new age key was created at {{ age_key }} on {{ inventory_hostname }}. Without it the backup cannot be
          decrypted. Copy the whole file into your password manager now (there: cat {{ age_key }}).
      when: age_new.changed
