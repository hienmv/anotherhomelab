# Phase 0 (K3S-GUIDE section 10): make node-workstation (CF-SV9) an always-on host and the admin workstation.
# No cluster change, no downtime. Idempotent: safe to re-run.
#
# Prompts every run: workstation sudo password (become_ask_pass), then the key passphrase twice
# (first run: invent one; later: Enter). Run it in a real terminal, not through a non-interactive shell.
#
#   cd ansible && ansible-playbook playbooks/workstation-prepare.yml
#   ... -e workstation_ip=<IP>   only while it is not yet on its static_ip (first run)

- name: Base system on the workstation
  hosts: workstation
  become: true
  tasks:
    # You (admin_user) browse on this desktop: your sudo keeps its password. The automation user
    # never logs in or browses: passwordless sudo, reached only via `sudo -iu ops` (your password).
    - name: No passwordless sudo for the human on the workstation
      ansible.builtin.file:
        path: "/etc/sudoers.d/{{ admin_user }}"
        state: absent

    - name: Passwordless sudo for the automation user
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ automation_user }}"
        content: "{{ automation_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s

    - name: Automation group (fixed GID)
      ansible.builtin.group:
        name: "{{ automation_user }}"
        gid: "{{ automation_uid }}"

    - name: Automation user is a service account (no password, hidden from the login screen)
      ansible.builtin.user:
        name: "{{ automation_user }}"
        uid: "{{ automation_uid }}"
        group: "{{ automation_user }}"
        shell: /bin/bash
        password: "!"
        comment: homelab automation

    - name: Hidden from the login screen
      ansible.builtin.copy:
        dest: "/var/lib/AccountsService/users/{{ automation_user }}"
        content: "[User]\nSystemAccount=true\n"
        mode: "0600"

    - name: Hostname {{ inventory_hostname }}
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"
      notify: Reboot

    - name: 127.0.1.1 points at the new hostname
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        line: "127.0.1.1 {{ inventory_hostname }}"

    - name: Homelab names in /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} homelab (ansible)"
        block: |
          {% for h in groups['all'] %}
          {{ hostvars[h].static_ip }} {{ h }}
          {% endfor %}
          {{ hostvars[k3s_server].static_ip }} {{ lan_names | join(' ') }}

    - name: Upgrade packages (only with -e upgrade_packages=true)
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600
      when: upgrade_packages | bool

    - name: Package index
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Base packages
      ansible.builtin.apt:
        name: [openssh-server, curl, git, jq, age, ansible, ca-certificates, python3-cryptography, python3-bcrypt, tmux]
        state: present

    # grafana.lan uses a certificate from a private CA (mkcert, made on the Mac in 2026-11; CA key
    # deleted 2026-11-12, cert valid until 2029-02-08). Only the CA's PUBLIC cert is installed here:
    # enough to trust grafana.lan, useless for signing anything.
    - name: Trust the grafana.lan CA (system store; curl, Chrome-like tools)
      ansible.builtin.copy:
        src: ../files/grafana-lan-ca.pem
        dest: /usr/local/share/ca-certificates/homelab-grafana-lan-ca.crt
        mode: "0644"
      register: lan_ca

    - name: Update the system CA store
      ansible.builtin.command: update-ca-certificates
      when: lan_ca is changed

    - name: Firefox policy directory
      ansible.builtin.file:
        path: /etc/firefox/policies
        state: directory
        mode: "0755"

    - name: CA cert where the Firefox snap can read it
      ansible.builtin.copy:
        src: ../files/grafana-lan-ca.pem
        dest: /etc/firefox/policies/homelab-grafana-lan-ca.pem
        mode: "0644"

    # Firefox has its own certificate store on Linux; this policy imports the CA at start.
    - name: Firefox policy - trust the grafana.lan CA
      ansible.builtin.copy:
        dest: /etc/firefox/policies/policies.json
        content: |
          {
            "policies": {
              "Certificates": {
                "Install": ["/etc/firefox/policies/homelab-grafana-lan-ca.pem"]
              }
            }
          }
        mode: "0644"

    - name: SSH server - keys only, no root login (LAN password brute force)
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-homelab.conf
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
        mode: "0644"
        validate: sshd -t -f %s
      notify: Reload sshd

    - name: logind drop-in directory (not shipped by Ubuntu)
      ansible.builtin.file:
        path: /etc/systemd/logind.conf.d
        state: directory
        mode: "0755"

    - name: Never sleep on lid close (AC, battery, docked)
      ansible.builtin.copy:
        dest: /etc/systemd/logind.conf.d/homelab.conf
        content: |
          [Login]
          HandleLidSwitch=ignore
          HandleLidSwitchExternalPower=ignore
          HandleLidSwitchDocked=ignore
        mode: "0644"
      notify: Reboot

    - name: Mask sleep targets (also stops GNOME idle suspend)
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        masked: true
      loop: [sleep.target, suspend.target, hibernate.target, hybrid-sleep.target]

    - name: Wi-Fi power saving off (fewer latency spikes and drops)
      ansible.builtin.copy:
        dest: /etc/NetworkManager/conf.d/wifi-powersave-off.conf
        content: |
          [connection]
          wifi.powersave = 2
        mode: "0644"
      notify: Reload NetworkManager

    # lan_link (inventory) picks the link that holds static_ip: wifi or ethernet, never both.
    - name: Static IP on the {{ lan_link }} link
      ansible.builtin.script:
        cmd: >-
          ../files/net-static.sh {{ lan_link }} {{ static_ip }} {{ lan_prefix }}
          {{ lan_gateway }} {{ lan_dns }} {{ wifi_profile | default('') | quote }}
      register: net
      changed_when: "'CHANGED' in net.stdout"

    - name: Follow the workstation to its static IP
      ansible.builtin.set_fact:
        ansible_host: "{{ static_ip }}"
      when: "'RECONNECT' in net.stdout"

    - name: Wait until it answers on {{ static_ip }}
      ansible.builtin.wait_for_connection:
        delay: 8
        timeout: 120
      when: "'RECONNECT' in net.stdout"

    - name: kubectl {{ kubectl_version }}
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        checksum: "sha256:https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl.sha256"
        dest: /usr/local/bin/kubectl
        mode: "0755"

    - name: sops {{ sops_version }}
      ansible.builtin.get_url:
        url: "https://github.com/getsops/sops/releases/download/{{ sops_version }}/sops-{{ sops_version }}.linux.amd64"
        checksum: "sha256:https://github.com/getsops/sops/releases/download/{{ sops_version }}/sops-{{ sops_version }}.checksums.txt"
        dest: /usr/local/bin/sops
        mode: "0755"

    - name: Download tarball tools (helm, k9s, flux)
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        checksum: "{{ item.checksum }}"
        dest: "/var/cache/{{ item.url | basename }}"
        mode: "0644"
      loop: "{{ tarball_tools }}"
      loop_control: { label: "{{ item.name }}" }

    - name: Install tarball tools to /usr/local/bin
      ansible.builtin.unarchive:
        src: "/var/cache/{{ item.url | basename }}"
        remote_src: true
        dest: /usr/local/bin
        include: ["{{ item.member }}"]
        extra_opts: "{{ item.extra_opts | default([]) }}"
        creates: "/usr/local/bin/.{{ item.name }}-{{ item.version }}"
      loop: "{{ tarball_tools }}"
      loop_control: { label: "{{ item.name }}" }
      register: unpacked

    - name: Version markers (re-install only when a version changes)
      ansible.builtin.file:
        path: "/usr/local/bin/.{{ item.item.name }}-{{ item.item.version }}"
        state: touch
        mode: "0644"
      loop: "{{ unpacked.results }}"
      loop_control: { label: "{{ item.item.name }}" }
      when: item.changed

  vars:
    tarball_tools:
      - name: helm
        version: "{{ helm_version }}"
        url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
        checksum: "sha256:https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz.sha256sum"
        member: linux-amd64/helm
        extra_opts: [--strip-components=1]
      - name: k9s
        version: "{{ k9s_version }}"
        url: "https://github.com/derailed/k9s/releases/download/{{ k9s_version }}/k9s_Linux_amd64.tar.gz"
        checksum: "sha256:https://github.com/derailed/k9s/releases/download/{{ k9s_version }}/checksums.sha256"
        member: k9s
      - name: flux
        version: "{{ flux_version }}"
        url: "https://github.com/fluxcd/flux2/releases/download/v{{ flux_version }}/flux_{{ flux_version }}_linux_amd64.tar.gz"
        checksum: "sha256:https://github.com/fluxcd/flux2/releases/download/v{{ flux_version }}/flux_{{ flux_version }}_checksums.txt"
        member: flux

  handlers:
    - name: Reload sshd
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded

    - name: Reload NetworkManager
      ansible.builtin.systemd_service:
        name: NetworkManager
        state: reloaded

    - name: Reboot
      ansible.builtin.reboot:
        msg: "ansible: hostname / logind change"
        reboot_timeout: 600
      when: ansible_connection != 'local'

- name: Keys and settings on the workstation (yours and the automation user's)
  hosts: workstation
  # Asked every run (vars_prompt cannot be conditional); once the keys and the repo exist, press Enter.
  vars_prompt:
    - name: key_passphrase
      prompt: "Passphrase for new keys (your id_homelab, ops's id_github); keys and repo already there: just Enter"
      private: true
      confirm: true
  tasks:
    - name: Which keys exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: ["{{ admin_key }}", "{{ github_key }}"]
      register: key_stat
      become: true

    - name: Repo already cloned?
      ansible.builtin.stat:
        path: "{{ repo_dest }}/.git"
      register: repo_stat

    - name: Keys to create; keep the passphrase for the clone play
      ansible.builtin.set_fact:
        missing_keys: "{{ key_stat.results | rejectattr('stat.exists') | map(attribute='item') | list }}"
        admin_key_passphrase: "{{ key_passphrase }}"
      no_log: true

    - name: Passphrase is at least 12 characters (empty = no protection, not allowed)
      ansible.builtin.assert:
        that: key_passphrase | length >= 12
        fail_msg: "Passphrase is {{ 'empty' if not key_passphrase else 'shorter than 12 characters' }}. Re-run and type one (input is hidden)."
        quiet: true
      when: missing_keys | length > 0 or not repo_stat.stat.exists

    # ---------- yours (admin_user): the key to the Pis ----------
    - name: Your .ssh folder
      ansible.builtin.file:
        path: "{{ admin_home }}/.ssh"
        state: directory
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0700"
      become: true

    # openssh_keypair encrypts in Python: the passphrase never appears in a process list.
    - name: Your key to the Pis (passphrase)
      community.crypto.openssh_keypair:
        path: "{{ admin_key }}"
        type: ed25519
        comment: "{{ inventory_hostname }}->homelab"
        passphrase: "{{ key_passphrase }}"
        private_key_format: ssh
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0600"
      become: true
      when: admin_key in missing_keys
      no_log: true

    - name: Your SSH client config (Pis as you, passphrase cached 8 h)
      ansible.builtin.blockinfile:
        path: "{{ admin_home }}/.ssh/config"
        create: true
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
        mode: "0600"
        marker: "# {mark} homelab (ansible)"
        block: |
          Host {{ groups['pis'] | join(' ') }}
            User {{ admin_user }}
            IdentityFile ~/.ssh/id_homelab
            IdentitiesOnly yes
          Host *
            AddKeysToAgent 8h
      become: true

    # Desktop login has GNOME's agent. Over SSH from the Mac there is none: start one on a
    # fixed socket and reuse it, so the passphrase is typed once per 8 h, not per command.
    - name: ssh-agent for your SSH sessions
      ansible.builtin.blockinfile:
        path: "{{ admin_home }}/.bashrc"
        marker: "# {mark} ssh-agent (ansible)"
        block: "{{ agent_snippet }}"
      become: true

    # ---------- the automation user's (runs as it, locally) ----------
    # The GitHub key (deploy key, this repo) is created with the same passphrase as yours.
    - name: Automation .ssh folder
      ansible.builtin.file:
        path: "{{ automation_home }}/.ssh"
        state: directory
        mode: "0700"

    - name: GitHub key of the automation user (passphrase)
      community.crypto.openssh_keypair:
        path: "{{ github_key }}"
        type: ed25519
        comment: "{{ inventory_hostname }}->github"
        passphrase: "{{ key_passphrase }}"
        private_key_format: ssh
        mode: "0600"
      when: github_key in missing_keys
      no_log: true

    - name: Read the GitHub public key
      ansible.builtin.slurp:
        src: "{{ github_key }}.pub"
      register: github_pub

    - name: Remember it
      ansible.builtin.set_fact:
        github_pubkey: "{{ github_pub.content | b64decode | trim }}"

    - name: Automation SSH client config (GitHub)
      ansible.builtin.blockinfile:
        path: "{{ automation_home }}/.ssh/config"
        create: true
        mode: "0600"
        marker: "# {mark} homelab (ansible)"
        block: |
          Host github.com
            User git
            IdentityFile ~/.ssh/id_github
            IdentitiesOnly yes
          Host *
            AddKeysToAgent 8h

    - name: ssh-agent and KUBECONFIG for the automation user
      ansible.builtin.blockinfile:
        path: "{{ automation_home }}/.bashrc"
        marker: "# {mark} ssh-agent (ansible)"
        block: "{{ agent_snippet }}"

    - name: KUBECONFIG
      ansible.builtin.lineinfile:
        path: "{{ automation_home }}/.bashrc"
        line: "export KUBECONFIG={{ kubeconfig }}"

    - name: Git settings of the automation user
      community.general.git_config:
        scope: global
        name: "{{ item.key }}"
        value: "{{ item.value }}"
      loop: "{{ {'user.name': 'homelab automation (' ~ inventory_hostname ~ ')', 'user.email': automation_user ~ '@' ~ inventory_hostname, 'pull.rebase': 'true', 'rebase.autoStash': 'true'} | dict2items }}"

  vars:
    agent_snippet: |
      if [ -z "$SSH_AUTH_SOCK" ]; then
        export SSH_AUTH_SOCK="$HOME/.ssh/agent.sock"
        ssh-add -l >/dev/null 2>&1
        if [ $? -eq 2 ]; then
          rm -f "$SSH_AUTH_SOCK"
          eval "$(ssh-agent -a "$SSH_AUTH_SOCK")" >/dev/null
        fi
      fi

# Accounts and keys ON the Pis (admin + automation user, IP restriction) are managed by
# playbooks/access.yml; this playbook only creates the keys on the workstation.

- name: GitHub deploy key for the workstation (read/write, this repo only)
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    # gh (logged in) exists on the Mac, not on node-workstation. Without it this check is skipped;
    # the key only has to be added once (fresh install, run from the Mac).
    - name: Is gh available here?
      ansible.builtin.command: gh auth status
      register: gh_ok
      changed_when: false
      failed_when: false

    - name: Deploy key check skipped
      ansible.builtin.debug:
        msg: "gh not available or not logged in here: GitHub deploy key not checked (fine if it exists already)."
      when: gh_ok.rc != 0

    - name: Existing deploy keys
      ansible.builtin.command: gh repo deploy-key list -R {{ repo_slug }}
      register: deploy_keys
      changed_when: false
      when: gh_ok.rc == 0

    # workstation key recreated -> the old entry no longer matches: stop instead of skipping.
    - name: Deploy key entry matches the workstation's current key
      ansible.builtin.assert:
        that: hostvars[admin_host].github_pubkey.split()[1] in deploy_keys.stdout
        fail_msg: >-
          Deploy key {{ deploy_key_title }} exists but holds another key. Delete it
          (gh repo deploy-key list/delete -R {{ repo_slug }}) and re-run.
        quiet: true
      when: gh_ok.rc == 0 and deploy_key_title in deploy_keys.stdout

    - name: Add the workstation deploy key
      ansible.builtin.command: >-
        gh repo deploy-key add - -R {{ repo_slug }} --title {{ deploy_key_title }} --allow-write
      args:
        stdin: "{{ hostvars[admin_host].github_pubkey }}"
      when: gh_ok.rc == 0 and deploy_key_title not in deploy_keys.stdout

- name: Kubeconfig and repo on the workstation
  hosts: workstation
  tasks:
    # Fresh install: k3s is not there yet (k3s.yml installs it and writes the kubeconfig itself).
    - name: Is k3s installed on the server?
      ansible.builtin.stat:
        path: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ k3s_server }}"
      become: true
      register: k3s_yaml_stat

    - name: Read kubeconfig from the current k3s server
      when: k3s_yaml_stat.stat.exists
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      delegate_to: "{{ k3s_server }}"
      become: true
      register: k3s_yaml
      no_log: true   # cluster-admin client key

    - name: Kubeconfig must not leak into output (--diff, -v)
      when: k3s_yaml_stat.stat.exists
      ansible.builtin.set_fact:
        kubeconfig_text: "{{ k3s_yaml.content | b64decode | replace('https://127.0.0.1:6443', 'https://' ~ hostvars[k3s_server].static_ip ~ ':6443') | replace(': default', ': ' ~ cluster_name) }}"
      no_log: true

    - name: ~/.kube
      ansible.builtin.file:
        path: "{{ kubeconfig | dirname }}"
        state: directory
        mode: "0700"

    - name: Admin kubeconfig (server address instead of 127.0.0.1)
      when: k3s_yaml_stat.stat.exists
      ansible.builtin.copy:
        dest: "{{ kubeconfig }}"
        content: "{{ kubeconfig_text }}"
        mode: "0600"
      no_log: true
      diff: false

    # The GitHub key has a passphrase and this SSH session has no agent: unlock it in a throwaway
    # agent (passphrase via env + SSH_ASKPASS, never on a command line), clone, kill the agent.
    - name: Clone the repo (only if missing; never touches an existing checkout)
      ansible.builtin.shell: |
        set -e
        askpass="$(mktemp)"; trap 'rm -f "$askpass"; ssh-agent -k >/dev/null 2>&1 || true' EXIT
        printf '#!/bin/sh\necho "$KEY_PASSPHRASE"\n' > "$askpass"; chmod 700 "$askpass"
        eval "$(ssh-agent -s)" >/dev/null
        SSH_ASKPASS="$askpass" SSH_ASKPASS_REQUIRE=force DISPLAY=none ssh-add {{ github_key }} </dev/null
        mkdir -p "$(dirname {{ repo_dest }})"
        GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=accept-new" git clone {{ repo_ssh_url }} {{ repo_dest }}
      args:
        creates: "{{ repo_dest }}/.git"
      environment:
        KEY_PASSPHRASE: "{{ hostvars[admin_host].admin_key_passphrase | default('') }}"
      no_log: true

    - name: Check cluster access
      when: k3s_yaml_stat.stat.exists
      ansible.builtin.command: kubectl get nodes -o wide
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: nodes
      changed_when: false

    - name: Nodes
      when: k3s_yaml_stat.stat.exists
      ansible.builtin.debug:
        var: nodes.stdout_lines
