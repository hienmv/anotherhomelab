# Which cluster folder (clusters/<name>/) this Ansible tree manages. Everything site-specific
# comes from that folder's site-settings.yaml (domain, repo, registry, ...); see that file.
cluster_name: homelab
# repo root = the folder above ansible/ (implicit localhost has no inventory_dir: use the playbook's)
repo_root: "{{ (inventory_dir | default(playbook_dir ~ '/..')) ~ '/..' }}"
site_settings_file: "{{ repo_root }}/clusters/{{ cluster_name }}/site-settings.yaml"
site: "{{ (lookup('ansible.builtin.file', site_settings_file) | from_yaml).data }}"

repo_ssh_url: "{{ site.GIT_REPO_SSH }}"
repo_slug: "{{ site.GIT_REPO_SLUG }}"

# Paths on the workstation. Everything automation needs belongs to the automation user;
# only your personal SSH key to the Pis is in your (admin) home.
admin_home: "/home/{{ admin_user }}"
automation_home: "/home/{{ automation_user }}"
repo_dest: "{{ automation_home }}/workspace/source/{{ cluster_name }}"
kubeconfig: "{{ automation_home }}/.kube/{{ cluster_name }}.yaml"
backup_dir: "{{ automation_home }}/{{ cluster_name }}-backup"
age_key: "{{ automation_home }}/.config/sops/age/keys.txt"
admin_key: "{{ admin_home }}/.ssh/id_homelab"            # you -> Pis (passphrase, ssh-agent)
automation_key: "{{ automation_home }}/.ssh/id_ops"       # ops -> Pis (no passphrase, IP-restricted)
github_key: "{{ automation_home }}/.ssh/id_github"        # ops -> GitHub (deploy key, passphrase)

admin_host: "{{ groups['workstation'] | first }}"   # admin workstation (kubectl, backups, keys)

# Pinned tool versions (checked 2026-11-11). kubectl matches the k3s server.
kubectl_version: v1.37.2
helm_version: v4.3.1
k9s_version: v0.51.0
flux_version: 2.10.0
sops_version: v3.13.3
rclone_version: v1.75.2            # backup uploads (S3 store on the SSD, later R2); checksum from SHA256SUMS

deploy_key_title: homelab-workstation-admin   # GitHub deploy key of the workstation (read/write)
k3s_version: v1.37.2+k3s1
k3s_server: "{{ groups['k3s_servers'] | first }}"   # set in inventory.yml (group k3s_servers)
k3s_old_server: node-8gb   # server before phase 2; used only by phase2-migrate.yml

# workstation-prepare: full package upgrade only when asked (-e upgrade_packages=true); a kernel update
# without a reboot is harmless, but the reboot takes the cluster down.
upgrade_packages: false

# Checked after a restore / migration (must answer 200). Paths per subdomain; '' = apex.
public_paths: ["", "notes.", "ticketlite.", "ticketlite./api/concerts"]
public_urls: "{{ public_paths | map('regex_replace', '^([^/]*)(.*)$', 'https://\\1' ~ site.DOMAIN ~ '\\2') | list }}"

# LAN-only names served by Traefik (ServiceLB answers on every node IP); written to the workstation's
# /etc/hosts, pointing at the k3s server. TLS: private CA, public cert in files/grafana-lan-ca.pem.
lan_names: [grafana.lan]

# Scheduled checks + alerting (files/homelab-check.sh, systemd timers as the automation user).
check_quick_every: "*:0/15"          # systemd OnCalendar: verify.yml without the canary
check_full_at: "*-*-* 04:15:00"      # once a day, everything (canary included)
# Expiry dates nothing else warns about; verify.yml reports a problem 30 days before.
expiry_warn_days: 30
expiry_dates:
  - { name: "ghcr-pull token (classic PAT, read:packages; K3S-GUIDE secrets)", date: "2027-02-07" }   # GitHub token page, checked 2026-11-16

# Backup store (docs/learn/13-ssd-and-backups.md, playbooks/backup-store.yml): Garage, an S3 server,
# as a plain systemd service on the node with the SSD, OUTSIDE Kubernetes (a broken cluster cannot
# take its own backups with it). One key per user, each allowed only its own bucket.
backup_store:
  host: node-8gb
  port: 3900
  region: garage
  capacity: 50G                      # of the 59 GB SSD; the rest: Postgres replica (stage 2), headroom
  data_dir: /mnt/ssd/backup/garage   # requires the SSD mount (systemd RequiresMountsFor)
  buckets:
    - { name: cnpg, key: cnpg-backup }        # Postgres WAL archive + base backups (part C)
    - { name: archives, key: workstation }    # nightly backup.yml archives
garage_version: v2.5.0
# Garage publishes no checksum file: sha256 pinned 2026-11-18 after comparing the download with the
# binary inside the official image dxflrs/garage:v2.5.0 (two channels, same hash).
garage_sha256: 69b6040cef428b993500c17dd0d0c1240acf2f3f667b9b05ceba4b9660db4e8c
backup_store_env: "{{ automation_home }}/.config/homelab/backup-s3.env"   # rclone settings + key (not in git)
backup_keep_days: 30
backup_at: "*-*-* 03:30:00"          # systemd OnCalendar: nightly backup.yml + upload
