admin_host: "{{ groups['workstation'] | first }}"   # admin workstation (kubectl, backups, keys)

# Pinned tool versions (checked 2026-11-11). kubectl matches the k3s server.
kubectl_version: v1.37.2
helm_version: v4.3.1
k9s_version: v0.51.0
flux_version: 2.10.0
sops_version: v3.13.3

repo_ssh_url: git@github.com:hienmv/anotherhomelab.git
repo_slug: hienmv/anotherhomelab
repo_dest: /home/hien/workspace/source/homelab
k3s_version: v1.37.2+k3s1
k3s_server: "{{ groups['k3s_servers'] | first }}"   # set in inventory.yml (group k3s_servers)
k3s_old_server: node-8gb   # server before phase 2; used only by phase2-migrate.yml

# workstation-prepare: full package upgrade only when asked (-e upgrade_packages=true); a kernel update
# without a reboot is harmless, but the reboot takes the cluster down.
upgrade_packages: false

# Checked after a restore / migration (must answer 200).
public_urls:
  - https://hien0ethan.com
  - https://notes.hien0ethan.com
  - https://ticketlite.hien0ethan.com
  - https://ticketlite.hien0ethan.com/api/concerts

# LAN-only names served by Traefik (ServiceLB answers on every node IP); written to the workstation's
# /etc/hosts, pointing at the k3s server. TLS: private CA, public cert in files/grafana-lan-ca.pem.
lan_names: [grafana.lan]
