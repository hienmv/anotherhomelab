# Homelab hosts: the ONE place for LAN addresses and per-node settings. Playbooks and scripts take
# every IP from here. IPs are static (set on each host; the router has no DHCP reservations).
# Host name here = OS hostname = Kubernetes node name. Ansible connects by IP (ansible_host), so
# it needs no /etc/hosts or ~/.ssh/config entries on the machine running it.
# Run on node-workstation (it detects itself and runs locally). Only its key opens the Pis; the Mac
# can still run plays that touch the workstation alone (ssh with ~/.ssh/id_sv9).
all:
  vars:
    ansible_user: hien
    lan_prefix: 24
    lan_gateway: 192.168.40.1
    lan_dns: 192.168.40.1
  children:
    workstation:
      hosts:
        node-workstation:   # Panasonic CF-SV9, amd64, 16 GB, SSD
          static_ip: 192.168.40.249
          # Link that holds static_ip: wifi or ethernet (switch = change here + re-run workstation-prepare).
          lan_link: wifi
          wifi_profile: JCOM_CKQY   # NetworkManager profile that gets static_ip when lan_link=wifi
          # Only while the workstation is not on its static_ip yet: -e workstation_ip=<current IP>.
          ansible_host: "{{ workstation_ip | default(static_ip) }}"
          ansible_ssh_private_key_file: "{{ '~/.ssh/id_sv9' if not is_self else omit }}"
          ansible_connection: "{{ 'local' if is_self else 'ssh' }}"   # on itself: no SSH to self
          is_self: "{{ lookup('pipe', 'hostname -s') == 'node-workstation' }}"
          k3s_labels: [role=data]
          # also a desktop: keep CPU and memory for GNOME, the browser, Ansible
          k3s_reserved: cpu=1,memory=3Gi
    pis:
      # ram_gb + sd_gb identify the board and the SD card (checked after the SD swap).
      # nm_profile: NetworkManager profile that holds static_ip.
      vars:
        ansible_host: "{{ static_ip }}"
        ansible_ssh_private_key_file: ~/.ssh/id_homelab   # node-workstation's key (the Mac's was removed 2026-11-12)
      hosts:
        node-8gb:   # Raspberry Pi 4B 8 GB
          static_ip: 192.168.40.250
          ram_gb: 8
          sd_gb: 64
          nm_profile: netplan-eth0
          k3s_labels: [role=apps]
          k3s_reserved: cpu=250m,memory=512Mi
        node-4gb:   # Raspberry Pi 4B 4 GB
          static_ip: 192.168.40.251
          ram_gb: 4
          sd_gb: 32
          nm_profile: netplan-eth0
          k3s_labels: [role=apps]
          k3s_reserved: memory=256Mi
        node-1gb:   # Raspberry Pi 3B+ 1 GB
          static_ip: 192.168.40.252
          ram_gb: 1
          sd_gb: 32
          nm_profile: Wired connection 1
          k3s_labels: [role=light]
          k3s_taints: [role=light:NoSchedule]   # weak PSU: only pods that tolerate it
          k3s_reserved: memory=128Mi
    # Cluster roles. Exactly one server. Moving the server = move the host here + rebuild.
    k3s_servers:
      hosts:
        node-workstation:
    k3s_agents:
      hosts:
        node-8gb:
        node-4gb:
        node-1gb:
    k3s:
      children:
        k3s_servers:
        k3s_agents:
