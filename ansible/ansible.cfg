[defaults]
inventory = inventory.yml
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
retry_files_enabled = false
# every run is appended here (who ran what, when, result); folder is git-ignored
log_path = ./logs/ansible.log

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = true

[privilege_escalation]
# Ansible runs as the automation user, which has passwordless sudo on every host: no prompt.
# (You authenticate once, when you switch to it: sudo -iu ops.)
become_ask_pass = false
