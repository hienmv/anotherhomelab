# Local run of the full system: http://localhost:8080
#   docker compose up --build
# Sample accounts: alice/alice123, bob/bob123, carol/carol123
name: ticketlite

x-backend-env: &backend-env
  DATABASE_URL: postgresql://app:app@postgres:5432/app
  REDIS_URL: redis://redis:6379/0
  SESSION_SECRET: 6c6f63616c2d6465762d6f6e6c792d6e6f742d612d7265616c2d736563726574
  COOKIE_SECURE: "false"
  # Traces -> collector (same config as the cluster) -> VictoriaTraces (UI: http://localhost:10428/select/vmui/)
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRICS_EXPORTER: none      # metrics: Prometheus /metrics, as in the cluster
  OTEL_LOGS_EXPORTER: none         # logs: stdout JSON, as in the cluster

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app"]
      interval: 2s
      retries: 30

  redis:
    image: redis:8.2-alpine
    command: ["--appendonly", "yes"]

  traces:
    image: victoriametrics/victoria-traces:v0.12.1
    ports: ["10428:10428"]

  otel-collector:
    image: otel/opentelemetry-collector-k8s:0.164.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["../../k8s/monitoring/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro"]
    environment:
      TRACES_ENDPOINT: http://traces:10428/insert/opentelemetry

  api:
    build: ./backend
    image: ticketlite-backend:dev
    environment:
      <<: *backend-env
      ROLE: api
      OTEL_SERVICE_NAME: ticketlite-api
    ports: ["8081:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    image: ticketlite-backend:dev
    environment:
      <<: *backend-env
      ROLE: worker
      OTEL_SERVICE_NAME: ticketlite-worker
    deploy:
      replicas: 2
    depends_on:
      api: { condition: service_started }

  web:
    build:
      context: ./web
      args:
        SITE_TIMEZONE: ${SITE_TIMEZONE:-UTC}   # cluster builds: TIMEZONE from site-settings
    image: ticketlite-web:dev
    environment:
      API_UPSTREAM: http://api:8080
    ports: ["8080:8080"]
    depends_on: [api]
