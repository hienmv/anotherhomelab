# Retry dependency downloads on transient network/server errors instead of failing the build.
# Seen 2026-11-09: CI failed on a 504 while fetching kotlin-compiler-embeddable (GitHub-hosted
# release download behind Maven Central). Retries: 1s, 2s, 4s, 8s, 16s backoff.
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=1000
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000
