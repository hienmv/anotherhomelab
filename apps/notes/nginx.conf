server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Old Jekyll URLs (hienmv.github.io): /tech/2020/10/10/heap.html -> /heap/
    rewrite "^/(tech|work-style)/\d{4}/\d{2}/\d{2}/([^/]+)\.html$" /$2/ permanent;

    # About lives on the landing site
    rewrite ^/about/?$ https://hien0ethan.com/about/ permanent;

    # Hashed build assets never change
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}
