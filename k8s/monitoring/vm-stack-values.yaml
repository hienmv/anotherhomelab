# victoria-metrics-k8s-stack values (chart 0.97.x) for the 3-Pi k3s cluster.
#
# Install / upgrade:
#   helm repo add vm https://victoriametrics.github.io/helm-charts/
#   kubectl -n monitoring create secret generic grafana-admin \
#     --from-literal=admin-user=admin --from-literal=admin-password="$(openssl rand -base64 18)"
#   helm upgrade --install vm vm/victoria-metrics-k8s-stack -n monitoring \
#     --version 0.97.1 -f k8s/monitoring/vm-stack-values.yaml
#
# Grafana: http://grafana.lan (LAN only; add "192.168.40.250 grafana.lan" to /etc/hosts).

# Metrics storage: pinned to pi4-8gb (role=data)
vmsingle:
  enabled: true
  spec:
    retentionPeriod: "30d"
    nodeSelector: { role: data }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }
    storage:
      storageClassName: local-path
      accessModes: [ReadWriteOnce]
      resources:
        requests: { storage: 10Gi }

# Scraper
vmagent:
  enabled: true
  spec:
    scrapeInterval: 30s
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 384Mi }

# Alerting: off for now (no notification channel yet)
alertmanager:
  enabled: false
vmalert:
  enabled: false

# Grafana on pi4-4gb (role=apps), LAN-only ingress
grafana:
  enabled: true
  nodeSelector: { role: apps }
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: local-path
    size: 1Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 384Mi }
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts: [grafana.lan]
    path: /
    pathType: Prefix
  grafana.ini:
    server:
      root_url: http://grafana.lan
    analytics:
      reporting_enabled: false
      check_for_updates: false

# Node metrics on every node, including tainted pi3
prometheus-node-exporter:
  tolerations:
    - operator: Exists
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 64Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 128Mi }

victoria-metrics-operator:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }

# k3s embeds these components and binds their metrics to localhost: skip
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
