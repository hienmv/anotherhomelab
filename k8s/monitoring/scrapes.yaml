# Extra scrape targets for VictoriaMetrics (operator CRDs).
---
# PostgreSQL (CloudNativePG built-in exporter on :9187)
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cnpg-pg
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [data]
  selector:
    matchLabels:
      cnpg.io/cluster: pg
  podMetricsEndpoints:
    - port: metrics
---
# cloudflared tunnel metrics (:2000)
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cloudflared
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [infra]
  selector:
    matchLabels:
      app: cloudflared
  podMetricsEndpoints:
    - port: metrics
---
# TicketLite api + worker: business metrics, HTTP latency, JVM (GET /metrics on :8080).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: ticketlite
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames: [apps]
  selector:
    matchLabels:
      app.kubernetes.io/name: ticketlite
    matchExpressions:
      - { key: app.kubernetes.io/component, operator: In, values: [api, worker] }
  podMetricsEndpoints:
    - port: http
      path: /metrics
