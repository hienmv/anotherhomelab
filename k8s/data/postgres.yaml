# PostgreSQL via CloudNativePG, pinned to pi4-8gb (role=data).
# Storage: local-path on SD card for now -> move to SSD before real data.
# Creates secret `pg-app` (username/password/uri) for database `app`, owner `app`.
# In-cluster host: pg-rw.data.svc:5432 (read-write), pg-ro / pg-r for replicas.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
  namespace: data
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  storage:
    storageClass: local-path
    size: 10Gi
  affinity:
    nodeSelector:
      role: data
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits:   { memory: 2Gi }
  postgresql:
    parameters:
      shared_buffers: 512MB
      effective_cache_size: 1536MB
      max_connections: "100"
      wal_compression: "on"
      # SD-card friendly: fewer, larger checkpoints
      checkpoint_timeout: 15min
      max_wal_size: 1GB
  bootstrap:
    initdb:
      database: app
      owner: app
  monitoring:
    enablePodMonitor: false
