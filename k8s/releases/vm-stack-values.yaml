# victoria-metrics-k8s-stack values (chart 0.97.x) for the 3-Pi k3s cluster.
# Applied by Flux: HelmRelease k8s/releases/vm-stack.yaml reads these via ConfigMap
# vm-stack-values (generated in k8s/releases/kustomization.yaml). Edit, commit, push.
#
# Out-of-band secrets (create once, never in git):
#   kubectl -n monitoring create secret generic grafana-admin \
#     --from-literal=admin-user=admin --from-literal=admin-password="$(openssl rand -base64 18)"
#   TLS secret grafana-lan-tls: see k8s/monitoring/grafana-https.yaml
#
# Grafana: https://grafana.lan (LAN only; add "192.168.40.250 grafana.lan" to /etc/hosts).

# Metrics storage: pinned to pi4-8gb (role=data)
vmsingle:
  enabled: true
  spec:
    retentionPeriod: "30d"
    nodeSelector: { role: data }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }
    storage:
      storageClassName: local-path
      accessModes: [ReadWriteOnce]
      resources:
        requests: { storage: 10Gi }

# Scraper
vmagent:
  enabled: true
  spec:
    scrapeInterval: 30s
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 384Mi }

# Alerting: off for now (no notification channel yet)
alertmanager:
  enabled: false
vmalert:
  enabled: false

# Grafana on pi4-4gb (role=apps): public via the tunnel + LAN-only grafana.lan
grafana:
  enabled: true
  nodeSelector: { role: apps }
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: local-path
    size: 1Gi
  resources:
    # 384Mi was OOMKilled (2026-11-08): ~415Mi steady, spikes on dashboard reload
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 768Mi }
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      # http -> https (Middleware in k8s/monitoring/grafana-https.yaml)
      traefik.ingress.kubernetes.io/router.middlewares: monitoring-redirect-https@kubernetescrd
    # LAN only (TLS from the Mac's mkcert CA). The public host grafana.hien0ethan.com has its own
    # Ingress without the redirect middleware: k8s/monitoring/grafana-public.yaml
    hosts: [grafana.lan]
    path: /
    pathType: Prefix
    tls:
      - secretName: grafana-lan-tls   # mkcert private CA, see grafana-https.yaml
        hosts: [grafana.lan]
  grafana.ini:
    server:
      root_url: https://grafana.hien0ethan.com
    security:
      cookie_secure: true            # both hosts are HTTPS-only
      cookie_samesite: lax
      disable_gravatar: true
    users:
      allow_sign_up: false           # only the admin account (secret monitoring/grafana-admin)
    auth.anonymous:
      enabled: false
    analytics:
      reporting_enabled: false
      check_for_updates: false

# Node metrics on every node, including tainted pi3
prometheus-node-exporter:
  tolerations:
    - operator: Exists
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 64Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 128Mi }

victoria-metrics-operator:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }

# k3s embeds these components and binds their metrics to localhost: skip
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
