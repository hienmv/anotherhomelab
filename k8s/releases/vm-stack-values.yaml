# victoria-metrics-k8s-stack values (chart 0.97.x) for the 3-Pi k3s cluster.
# Applied by Flux: HelmRelease k8s/releases/vm-stack.yaml reads these via ConfigMap
# vm-stack-values (generated in k8s/releases/kustomization.yaml). Edit, commit, push.
#
# Out-of-band secrets (create once, never in git):
#   kubectl -n monitoring create secret generic grafana-admin \
#     --from-literal=admin-user=admin --from-literal=admin-password="$(openssl rand -base64 18)"
#   TLS secret grafana-lan-tls: see k8s/monitoring/grafana-https.yaml
#
# Grafana: https://grafana.lan (LAN only, used from node-workstation: /etc/hosts entry + CA trust
# by workstation-prepare.yml) and https://grafana.${DOMAIN} (public, Cloudflare Access).

# Metrics storage: pinned to the role=data node (node-workstation, SSD)
vmsingle:
  enabled: true
  spec:
    retentionPeriod: "30d"
    nodeSelector: { role: data }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1Gi }
    storage:
      storageClassName: local-path
      accessModes: [ReadWriteOnce]
      resources:
        requests: { storage: 10Gi }

# Scraper
vmagent:
  enabled: true
  spec:
    scrapeInterval: 30s
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      # 384Mi was OOMKilled on the first full scrape after the 2026-11-12 rebuild (4 nodes)
      limits: { memory: 768Mi }

# Central logs (since 2026-11-16, docs/learn/9-monitoring-grafana.md): vlagent on EVERY node reads the
# container log files and ships each line within seconds to VictoriaLogs on the role=data node. Logs then
# survive pod replacement and a Pi going down. Grafana: Explore -> "VictoriaLogs (DS)".
# The operator connects them (vlagent -> vlsingle, Grafana data source -> vlsingle).
vlsingle:
  enabled: true
  spec:
    retentionPeriod: "14d"
    extraArgs:
      retention.maxDiskSpaceUsageBytes: 8GiB   # whichever comes first: 14 days or 8 GiB
    nodeSelector: { role: data }
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
    storage:
      storageClassName: local-path
      accessModes: [ReadWriteOnce]
      resources:
        requests: { storage: 10Gi }

vlagent:
  enabled: true
  spec:
    k8sCollector:
      enabled: true          # DaemonSet: one collector per node, reads /var/log/pods
    tolerations:
      - operator: Exists     # also on tainted node-1gb
    resources:
      requests: { cpu: 20m, memory: 48Mi }
      limits: { memory: 192Mi }

# Traces (since 2026-11-16, docs/learn/10-tracing.md): apps (OpenTelemetry Java agent) -> otel-collector
# (k8s/monitoring/otel-collector.yaml, drops noise) -> VictoriaTraces. Grafana: Explore -> VictoriaTraces.
vtsingle:
  enabled: true
  spec:
    retentionPeriod: "7d"
    extraArgs:
      retention.maxDiskSpaceUsageBytes: 4GiB   # whichever comes first: 7 days or 4 GiB
    nodeSelector: { role: data }
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
    storage:
      storageClassName: local-path
      accessModes: [ReadWriteOnce]
      resources:
        requests: { storage: 5Gi }

# Grafana data sources for logs and traces, linked both ways:
#   a trace -> "Logs for this span" (VictoriaLogs, trace_id:=...)
#   a log line with trace_id -> its trace (VictoriaTraces)
# A double dollar below is Flux's escape: Grafana receives a single dollar (its own variables).
defaultDatasources:
  victorialogs:
    datasources:
      - name: VictoriaLogs (DS)
        access: proxy
        uid: VictoriaLogs
        type: victoriametrics-logs-datasource
        plugin: true
        jsonData:
          derivedFields:
            - name: trace_id
              matcherType: label
              matcherRegex: trace_id
              url: "$${__value.raw}"
              datasourceUid: VictoriaTraces
  victoriatraces:
    datasources:
      - name: VictoriaTraces
        access: proxy
        uid: VictoriaTraces
        type: jaeger
        jsonData:
          tracesToLogsV2:
            datasourceUid: VictoriaLogs
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            customQuery: true
            query: 'trace_id:="$${__trace.traceId}"'

# Alerting (since 2026-11-18, docs/learn/11-slo.md): vmalert evaluates the rules every 20 s (our SLO rules,
# k8s/monitoring/slo-rules.yaml, plus the chart's default Kubernetes rules), Alertmanager groups the
# alerts and sends the SLO ones to Telegram. Its config is a Secret made from
# ~/.config/homelab/alerting.env by ansible/playbooks/alerting.yml (bot token never in git).
# Default-rule alerts are not sent (only visible in vmalert): verify.yml covers those failures.
vmalert:
  enabled: true
  spec:
    nodeSelector: { role: data }
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 256Mi }
alertmanager:
  enabled: true
  spec:
    configSecret: alertmanager-config   # key alertmanager.yaml; created by ansible/playbooks/alerting.yml
    nodeSelector: { role: data }
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          resources:
            requests: { storage: 1Gi }   # silences + notification log survive a restart

# Grafana on a role=apps node: public via the tunnel (behind Cloudflare Access) + LAN-only grafana.lan
grafana:
  enabled: true
  nodeSelector: { role: apps }
  # Logs data source (VictoriaLogs). Downloaded from grafana.com on every start (Grafana is stateless).
  plugins:
    - victoriametrics-logs-datasource@0.33.1
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Stateless since 2026-11-16: everything Grafana needs comes from git or a Secret (dashboards via
  # the sidecar, datasources from the chart, admin from grafana-admin), so it can start on either
  # apps node. A local-path volume tied it to the one Pi it first started on. Cost: anything made
  # only in the UI (dashboards, preferences) and login sessions are lost on restart: put dashboards
  # in k8s/monitoring/dashboards/ instead.
  persistence:
    enabled: false
  resources:
    # 384Mi was OOMKilled (2026-11-08): ~415Mi steady, spikes on dashboard reload
    requests: { cpu: 50m, memory: 256Mi }
    limits: { memory: 768Mi }
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      # http -> https (Middleware in k8s/monitoring/grafana-https.yaml)
      traefik.ingress.kubernetes.io/router.middlewares: monitoring-redirect-https@kubernetescrd
    # LAN only (TLS from a private CA, see grafana-https.yaml). The public host grafana.${DOMAIN} has its own
    # Ingress without the redirect middleware: k8s/monitoring/grafana-public.yaml
    hosts: [grafana.lan]
    path: /
    pathType: Prefix
    tls:
      - secretName: grafana-lan-tls   # private CA, see grafana-https.yaml
        hosts: [grafana.lan]
  grafana.ini:
    server:
      root_url: https://grafana.${DOMAIN}
    security:
      cookie_secure: true            # both hosts are HTTPS-only
      cookie_samesite: lax
      disable_gravatar: true
    users:
      allow_sign_up: false           # only the admin account (secret monitoring/grafana-admin)
    auth.anonymous:
      enabled: false
    analytics:
      reporting_enabled: false
      check_for_updates: false

# Node metrics on every node, including tainted node-1gb
prometheus-node-exporter:
  tolerations:
    - operator: Exists
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 64Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 128Mi }

victoria-metrics-operator:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }

# k3s embeds these components and binds their metrics to localhost: skip
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
