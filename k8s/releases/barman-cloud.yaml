# Barman Cloud plugin for CloudNativePG: continuous Postgres backup (WAL archiving + base backups)
# to S3-compatible storage (the Garage store on node-8gb's SSD). Replaces CNPG's built-in barmanObjectStore, which is
# removed in CNPG 1.31. Must run in the operator's namespace. Backup target: k8s/data/objectstore.yaml.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: barman-cloud
  namespace: flux-system
spec:
  interval: 1h
  releaseName: barman-cloud
  targetNamespace: cnpg-system
  dependsOn:
    - name: cnpg
    - name: cert-manager
  chart:
    spec:
      chart: plugin-barman-cloud
      version: 0.8.1           # plugin v0.15.1 (2026-09-30; 0.9.0 was < 2 weeks old on 2026-11-18)
      sourceRef: { kind: HelmRepository, name: cnpg, namespace: flux-system }
  install:
    crds: CreateReplace
    remediation: { retries: 3 }
  upgrade:
    crds: CreateReplace
    remediation: { retries: 3 }
  values:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
