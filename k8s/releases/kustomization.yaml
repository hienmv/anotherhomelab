apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - repositories.yaml
  - cnpg.yaml
  - cert-manager.yaml   # for the Barman Cloud plugin (mTLS to the CNPG operator)
  - barman-cloud.yaml   # Postgres continuous backup (docs/learn/13-ssd-and-backups.md)
  - vm-stack.yaml
  - descheduler.yaml    # re-spread copies after a node returns (docs/design/2026-11-21-descheduler.md)
configMapGenerator:
  - name: vm-stack-values
    namespace: flux-system
    files:
      - values.yaml=vm-stack-values.yaml
    options:
      labels:
        # helm-controller upgrades the release as soon as this ConfigMap changes, instead of at
        # its next hourly check (docs/learn/12-gitops-secrets.md): no `flux reconcile` needed.
        reconcile.fluxcd.io/watch: Enabled
generatorOptions:
  disableNameSuffixHash: true
