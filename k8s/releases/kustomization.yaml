apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - repositories.yaml
  - cnpg.yaml
  - vm-stack.yaml
configMapGenerator:
  - name: vm-stack-values
    namespace: flux-system
    files:
      - values.yaml=vm-stack-values.yaml
generatorOptions:
  disableNameSuffixHash: true
