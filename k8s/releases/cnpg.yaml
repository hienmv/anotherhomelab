# CloudNativePG operator. releaseName matches the original `helm install cnpg`
# so Flux adopts the existing release instead of reinstalling it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: flux-system
spec:
  interval: 1h
  releaseName: cnpg
  targetNamespace: cnpg-system
  storageNamespace: cnpg-system
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.1
      sourceRef: { kind: HelmRepository, name: cnpg, namespace: flux-system }
  install:
    crds: CreateReplace
    remediation: { retries: 3 }
  upgrade:
    crds: CreateReplace
    remediation: { retries: 3 }
  # 2 copies on different nodes (docs/design/2026-11-22-postgres-replica.md, lab results): the operator
  # is what promotes the replica. With 1 copy on the primary's node, a dead node took the operator with it:
  # no failover until Kubernetes evicted and restarted the operator (~6 min in the lab). The operator uses
  # leader election (--leader-elect): one copy works, the other takes over the lease within ~15 s.
  values:
    replicaCount: 2
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels: { app.kubernetes.io/name: cloudnative-pg, app.kubernetes.io/instance: cnpg }
