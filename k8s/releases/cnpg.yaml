# CloudNativePG operator. releaseName matches the original `helm install cnpg`
# so Flux adopts the existing release instead of reinstalling it.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: flux-system
spec:
  interval: 1h
  releaseName: cnpg
  targetNamespace: cnpg-system
  storageNamespace: cnpg-system
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.1
      sourceRef: { kind: HelmRepository, name: cnpg, namespace: flux-system }
  install:
    crds: CreateReplace
    remediation: { retries: 3 }
  upgrade:
    crds: CreateReplace
    remediation: { retries: 3 }
