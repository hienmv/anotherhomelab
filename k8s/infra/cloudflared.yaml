# Cloudflare Tunnel connector in k3s: 2 copies on different nodes (since 2026-11-16). Both connect
# to the same tunnel; Cloudflare uses whichever is up. If node-workstation (Postgres/Redis) fails,
# TicketLite is down anyway, but landing and notes stay online through the other copy.
# Tunnel: test-cloudflared-tunnel (${CLOUDFLARE_TUNNEL_ID})
# DNS (Cloudflare dashboard): CNAME @ and * -> <tunnel-id>.cfargotunnel.com, proxied.
#
# Credentials secret is created out-of-band (never commit it):
#   kubectl -n infra create secret generic tunnel-creds --from-file=credentials.json=<tunnel-id>.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  namespace: infra
data:
  config.yaml: |
    tunnel: ${CLOUDFLARE_TUNNEL_ID}
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: ${DOMAIN}
        service: http://traefik.kube-system.svc.cluster.local:80
      - hostname: "*.${DOMAIN}"
        service: http://traefik.kube-system.svc.cluster.local:80
      - service: http_status:404
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: infra
spec:
  replicas: 2
  selector:
    matchLabels: { app: cloudflared }
  template:
    metadata:
      labels: { app: cloudflared }
      annotations:
        config-rev: "1"   # bump to restart pod after editing the ConfigMap
    spec:
      # 2 copies on different nodes when possible (soft: still runs if only one node is left)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: cloudflared }
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.7
          args: ["tunnel", "--config", "/etc/cloudflared/config/config.yaml", "run"]
          ports:
            - { name: metrics, containerPort: 2000 }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: config, mountPath: /etc/cloudflared/config, readOnly: true }
            - { name: creds, mountPath: /etc/cloudflared/creds, readOnly: true }
      volumes:
        - name: config
          configMap: { name: cloudflared }
        - name: creds
          secret: { secretName: tunnel-creds }
---
# Voluntary disruptions (node drain, k3s upgrade) take at most one copy at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cloudflared
  namespace: infra
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: cloudflared }
