# Secrets, encrypted with SOPS + age, decrypted by Flux (docs/learn/12-gitops-secrets.md).
# Do not edit this list by hand: scripts/secrets/index.sh rewrites it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - apps/ghcr-pull.sops.yaml
  - apps/ticketlite.sops.yaml
  - data/backup-s3.sops.yaml
  - data/redis.sops.yaml
  - infra/tunnel-creds.sops.yaml
  - monitoring/alertmanager-config.sops.yaml
  - monitoring/grafana-admin.sops.yaml
  - monitoring/grafana-lan-tls.sops.yaml
