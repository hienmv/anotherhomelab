# Notes app (apps/notes, Astro static build on nginx): https://notes.hien0ethan.com
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes
  namespace: apps
  labels: { app.kubernetes.io/name: notes }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: notes }
  template:
    metadata:
      labels: { app.kubernetes.io/name: notes }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: notes
          image: ghcr.io/hienmv/notes
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 48Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: notes
  namespace: apps
spec:
  selector: { app.kubernetes.io/name: notes }
  ports: [{ name: http, port: 80, targetPort: http }]
