apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notes
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - host: notes.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: notes, port: { name: http } } }
