# https://hien0ethan.com -> site. Plus the fallback for every hostname without its own Ingress
# rule (typos, retired names like tickets., direct IP access): 301 to the site, path kept.
# Host-less rules have the lowest priority in Traefik, so real hosts are never affected.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - host: hien0ethan.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: site, port: { name: http } } }
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: to-site
  namespace: apps
spec:
  redirectRegex:
    regex: ^https?://[^/]+(.*)
    replacement: https://hien0ethan.com${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fallback-to-site
  namespace: apps
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: apps-to-site@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: site, port: { name: http } } }
