# Landing page (apps/landing, Astro on nginx): https://${DOMAIN}. Proxies /featured.json
# from the notes Service in-cluster (NOTES_UPSTREAM default in the image).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
  namespace: apps
  labels: { app.kubernetes.io/name: landing }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: landing }
  template:
    metadata:
      labels: { app.kubernetes.io/name: landing }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      # 2 copies on different nodes when possible (soft: still runs if only one node is left)
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: landing }
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: landing
          image: landing   # registry + tag: images in kustomization.yaml
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 48Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: landing
  namespace: apps
spec:
  selector: { app.kubernetes.io/name: landing }
  ports: [{ name: http, port: 80, targetPort: http }]
---
# Voluntary disruptions (node drain, k3s upgrade) take at most one copy at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: landing
  namespace: apps
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: landing }
