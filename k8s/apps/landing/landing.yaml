# Landing page for the apex domain https://hien0ethan.com.
# Content: index.html in this folder (rendered into ConfigMap `landing-html` by kustomize).
# Edit index.html, commit, push: the ConfigMap name gets a new hash, so the pod restarts with it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
  namespace: apps
  labels: { app.kubernetes.io/name: landing }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: landing }
  template:
    metadata:
      labels: { app.kubernetes.io/name: landing }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: http }
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: html, mountPath: /usr/share/nginx/html, readOnly: true }
      volumes:
        - name: html
          configMap: { name: landing-html }
---
apiVersion: v1
kind: Service
metadata:
  name: landing
  namespace: apps
spec:
  selector: { app.kubernetes.io/name: landing }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: landing
  namespace: apps
spec:
  ingressClassName: traefik
  rules:
    - host: hien0ethan.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: landing, port: { name: http } } }
---
# Fallback: any hostname without its own Ingress rule (typos, old names like tickets.,
# direct IP access) is redirected to the landing page, keeping the path.
# Host-less rules have the lowest priority in Traefik, so real hosts are never affected.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: to-landing
  namespace: apps
spec:
  redirectRegex:
    regex: ^https?://[^/]+(.*)
    replacement: https://hien0ethan.com${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fallback-to-landing
  namespace: apps
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: apps-to-landing@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: landing, port: { name: http } } }
