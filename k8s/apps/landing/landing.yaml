# Landing page (apps/landing, Astro on nginx): https://hien0ethan.com. Proxies /featured.json
# from the notes Service in-cluster (NOTES_UPSTREAM default in the image).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing
  namespace: apps
  labels: { app.kubernetes.io/name: landing }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: landing }
  template:
    metadata:
      labels: { app.kubernetes.io/name: landing }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: landing
          image: ghcr.io/hienmv/landing
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 5m, memory: 8Mi }
            limits: { memory: 48Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: landing
  namespace: apps
spec:
  selector: { app.kubernetes.io/name: landing }
  ports: [{ name: http, port: 80, targetPort: http }]
