apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - backend.yaml
  - web.yaml
# Image tags are bumped by CI (.github/workflows/ticketlite.yml) after each build on main.
images:
  - name: ticketlite-backend
    newName: ${IMAGE_REGISTRY}/ticketlite-backend
    newTag: sha-c70321e
  - name: ticketlite-web
    newName: ${IMAGE_REGISTRY}/ticketlite-web
    newTag: sha-c70321e
