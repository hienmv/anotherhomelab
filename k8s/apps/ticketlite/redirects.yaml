# Fallback: any hostname without its own Ingress rule (typos like ticket.hien0ethan.com,
# old links, direct IP access) is redirected to the main app, keeping the path:
#   https://ticket.hien0ethan.com/orders -> https://hien0ethan.com/orders
# Host-less rules have the lowest priority in Traefik, so real hosts are never affected.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: to-main-app
  namespace: apps
spec:
  redirectRegex:
    regex: ^https?://[^/]+(.*)
    replacement: https://hien0ethan.com${1}
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fallback-to-main-app
  namespace: apps
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: apps-to-main-app@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: ticketlite-web, port: { name: http } } }
