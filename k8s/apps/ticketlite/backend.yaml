# TicketLite backend: one image, two roles.
#   api    - HTTP API (login, concerts, orders), runs DB migrations on start
#   worker - consumes the Redis stream `orders`, confirms purchases in Postgres
# Secrets (out of git): apps/app-env (DATABASE_URL, REDIS_URL), apps/ticketlite (SESSION_SECRET).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketlite-api
  namespace: apps
  labels: { app.kubernetes.io/name: ticketlite, app.kubernetes.io/component: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: ticketlite, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ticketlite, app.kubernetes.io/component: api }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: ticketlite, app.kubernetes.io/component: api }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ghcr.io/hienmv/ticketlite-backend
          env:
            - { name: ROLE, value: api }
            - { name: COOKIE_SECURE, value: "true" }
          envFrom:
            - secretRef: { name: app-env }
            - secretRef: { name: ticketlite }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: ticketlite-api
  namespace: apps
spec:
  selector: { app.kubernetes.io/name: ticketlite, app.kubernetes.io/component: api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketlite-worker
  namespace: apps
  labels: { app.kubernetes.io/name: ticketlite, app.kubernetes.io/component: worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: ticketlite, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ticketlite, app.kubernetes.io/component: worker }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: ticketlite, app.kubernetes.io/component: worker }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ghcr.io/hienmv/ticketlite-backend
          env:
            - { name: ROLE, value: worker }
          envFrom:
            - secretRef: { name: app-env }
            - secretRef: { name: ticketlite }
          ports: [{ name: http, containerPort: 8080 }]
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 160Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
