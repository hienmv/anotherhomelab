# TicketLite backend: one image, two roles.
#   api    - HTTP API (login, concerts, orders), runs DB migrations on start
#   worker - consumes the Redis stream `orders`, confirms purchases in Postgres
# Secrets (out of git): apps/app-env (DATABASE_URL, REDIS_URL), apps/ticketlite (SESSION_SECRET).
# Traces: OTEL_* env below; logs: JSON on stdout; metrics: GET /metrics.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketlite-api
  namespace: apps
  labels: { app.kubernetes.io/name: ticketlite, app.kubernetes.io/component: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: ticketlite, app.kubernetes.io/component: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ticketlite, app.kubernetes.io/component: api }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: ticketlite, app.kubernetes.io/component: api }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: ticketlite-backend   # registry + tag: images in kustomization.yaml
          env:
            - { name: ROLE, value: api }
            - { name: COOKIE_SECURE, value: "true" }
            # Reads on the Postgres replica when correct (docs/design/2026-11-25-read-routing.md); the
            # user and password come from DATABASE_URL. Remove this line = every query on the primary.
            - { name: DATABASE_READ_HOST, value: pg-ro.data.svc.cluster.local }
            # Tracing (docs/learn/10-tracing.md): the OpenTelemetry Java agent in the image sends spans to
            # the collector, which filters noise and forwards to VictoriaTraces.
            - { name: OTEL_SERVICE_NAME, value: ticketlite-api }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.monitoring.svc.cluster.local:4318" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf }
            - { name: OTEL_METRICS_EXPORTER, value: none }   # metrics: Prometheus /metrics (vmagent)
            - { name: OTEL_LOGS_EXPORTER, value: none }      # logs: stdout JSON (vlagent)
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=ticketlite,deployment.environment.name=homelab" }
          envFrom:
            - secretRef: { name: app-env }
            - secretRef: { name: ticketlite }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            # +64Mi for the OpenTelemetry agent (2026-11-16)
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 640Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: ticketlite-api
  namespace: apps
spec:
  selector: { app.kubernetes.io/name: ticketlite, app.kubernetes.io/component: api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticketlite-worker
  namespace: apps
  labels: { app.kubernetes.io/name: ticketlite, app.kubernetes.io/component: worker }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: ticketlite, app.kubernetes.io/component: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ticketlite, app.kubernetes.io/component: worker }
    spec:
      imagePullSecrets: [{ name: ghcr-pull }]
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: ticketlite, app.kubernetes.io/component: worker }
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ticketlite-backend   # registry + tag: images in kustomization.yaml
          env:
            - { name: ROLE, value: worker }
            # Tracing (docs/learn/10-tracing.md): the OpenTelemetry Java agent in the image sends spans to
            # the collector, which filters noise and forwards to VictoriaTraces.
            - { name: OTEL_SERVICE_NAME, value: ticketlite-worker }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.monitoring.svc.cluster.local:4318" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf }
            - { name: OTEL_METRICS_EXPORTER, value: none }   # metrics: Prometheus /metrics (vmagent)
            - { name: OTEL_LOGS_EXPORTER, value: none }      # logs: stdout JSON (vlagent)
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.namespace=ticketlite,deployment.environment.name=homelab" }
          envFrom:
            - secretRef: { name: app-env }
            - secretRef: { name: ticketlite }
          ports: [{ name: http, containerPort: 8080 }]
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            # +64Mi for the OpenTelemetry agent (2026-11-16)
            requests: { cpu: 50m, memory: 224Mi }
            limits: { memory: 448Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
# Voluntary disruptions (node drain, k3s upgrade) take at most one copy at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ticketlite-api
  namespace: apps
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ticketlite, app.kubernetes.io/component: api }
---
# Voluntary disruptions (node drain, k3s upgrade) take at most one copy at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ticketlite-worker
  namespace: apps
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ticketlite, app.kubernetes.io/component: worker }
