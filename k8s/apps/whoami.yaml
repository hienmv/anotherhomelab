# Demo app: echoes request info (headers, IPs). Useful for debugging the tunnel/ingress.
# Only on https://whoami.hien0ethan.com. It used to be a catch-all (no host), which made
# typos like ticket.hien0ethan.com silently show whoami; unknown hosts now get Traefik's 404.
apiVersion: apps/v1
kind: Deployment
metadata: { name: whoami, namespace: apps }
spec:
  replicas: 1
  selector: { matchLabels: { app: whoami } }
  template:
    metadata: { labels: { app: whoami } }
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata: { name: whoami, namespace: apps }
spec:
  selector: { app: whoami }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: whoami, namespace: apps }
spec:
  ingressClassName: traefik
  rules:
    - host: whoami.hien0ethan.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: whoami, port: { number: 80 } } }
