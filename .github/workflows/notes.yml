# CI/CD for the notes app (apps/notes, Astro) on notes.<DOMAIN> (DOMAIN in site-settings).
# Notes are content: Markdown changes DO trigger a build (only README/DESIGN are ignored).
#   PR:   astro check, unit tests, build, link check (inside the Docker build), no push.
#   main: same, push <IMAGE_REGISTRY>/notes (amd64 + arm64), bump the tag in k8s/apps/notes/. Flux deploys.
name: notes

on:
  push:
    branches: [main]
    paths:
      - "apps/notes/**"
      - "!apps/notes/README.md"
      - ".github/workflows/notes.yml"
      - ".github/workflows/build-image.yml"
      - "clusters/*/site-settings.yaml"
      - ".github/workflows/bump-tag.yml"
  pull_request:
    paths:
      - "apps/notes/**"
      - "!apps/notes/README.md"
      - ".github/workflows/notes.yml"
      - ".github/workflows/build-image.yml"
      - "clusters/*/site-settings.yaml"
  workflow_dispatch:

concurrency:
  group: notes-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: notes
      context: apps/notes
      push: ${{ github.event_name != 'pull_request' }}

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/bump-tag.yml
    permissions:
      contents: write
    with:
      app: notes
      kustomization: k8s/apps/notes/kustomization.yaml
