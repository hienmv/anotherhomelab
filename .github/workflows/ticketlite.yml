# CI/CD for TicketLite.
#   PR:   build + test both images (no push).
#   main: build + test, push arm64 images to GHCR, then bump the image tags in
#         k8s/apps/ticketlite/kustomization.yaml. Flux deploys that commit to the cluster.
name: ticketlite

on:
  push:
    branches: [main]
    paths:
      - "apps/ticketlite/**"
      - ".github/workflows/ticketlite.yml"
  pull_request:
    paths:
      - "apps/ticketlite/**"
      - ".github/workflows/ticketlite.yml"
  workflow_dispatch:

concurrency:
  group: ticketlite-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.component }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        component: [backend, web]
    steps:
      - uses: actions/checkout@v4

      # Build stages run natively on amd64 (--platform=$BUILDPLATFORM); QEMU only covers
      # the arm64 runtime stage, which has no RUN steps.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hienmv/ticketlite-${{ matrix.component }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build, test${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: apps/ticketlite/${{ matrix.component }}
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ticketlite-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=ticketlite-${{ matrix.component }}

  deploy:
    name: bump image tags (Flux deploys)
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set image tags to this commit
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          sed -i -E "s/^(\s*newTag: ).*/\1${TAG}/" k8s/apps/ticketlite/kustomization.yaml
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(ticketlite): ${TAG} [skip ci]" || { echo "nothing to change"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
