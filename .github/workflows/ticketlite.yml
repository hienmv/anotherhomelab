# CI/CD for TicketLite (apps/ticketlite).
#   PR:   build + test both images (no push).
#   main: build + test, push arm64 images to GHCR, then bump the image tags in
#         k8s/apps/ticketlite/kustomization.yaml. Flux deploys that commit to the cluster.
# Shared steps: build-image.yml, bump-tag.yml.
name: ticketlite

on:
  push:
    branches: [main]
    paths:
      - "apps/ticketlite/**"
      - "!apps/ticketlite/**/*.md"
      - ".github/workflows/ticketlite.yml"
      - ".github/workflows/build-image.yml"
      - ".github/workflows/bump-tag.yml"
  pull_request:
    paths:
      - "apps/ticketlite/**"
      - "!apps/ticketlite/**/*.md"
      - ".github/workflows/ticketlite.yml"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

concurrency:
  group: ticketlite-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        component: [backend, web]
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: ticketlite-${{ matrix.component }}
      context: apps/ticketlite/${{ matrix.component }}
      push: ${{ github.event_name != 'pull_request' }}

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/bump-tag.yml
    permissions:
      contents: write
    with:
      app: ticketlite
      kustomization: k8s/apps/ticketlite/kustomization.yaml
