# Reusable: set every image tag in an app's kustomization to sha-<7> of this commit and push to
# main. Flux then deploys it. [skip ci] stops the commit from triggering builds again.
name: bump-tag

on:
  workflow_call:
    inputs:
      app:
        description: App name, used in the commit message
        required: true
        type: string
      kustomization:
        description: Path to the app's kustomization.yaml (images[].newTag is rewritten)
        required: true
        type: string

jobs:
  bump:
    name: bump image tags (Flux deploys)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Set image tags to this commit
        env:
          APP: ${{ inputs.app }}
          FILE: ${{ inputs.kustomization }}
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          sed -i -E "s/^(\s*newTag: ).*/\1${TAG}/" "$FILE"
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy(${APP}): ${TAG} [skip ci]" || { echo "nothing to change"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
