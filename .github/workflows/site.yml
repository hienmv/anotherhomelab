# CI/CD for the personal site (apps/site, Astro) on hien0ethan.com.
#   PR:   astro check, unit tests, build, link check (inside the Docker build), no push.
#   main: same, push ghcr.io/hienmv/site (arm64), bump the tag in k8s/apps/site/. Flux deploys.
# Notes are content: Markdown changes DO trigger a build (unlike ticketlite).
name: site

on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "!apps/site/DESIGN.md"
      - ".github/workflows/site.yml"
      - ".github/workflows/build-image.yml"
      - ".github/workflows/bump-tag.yml"
  pull_request:
    paths:
      - "apps/site/**"
      - "!apps/site/DESIGN.md"
      - ".github/workflows/site.yml"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-image.yml
    permissions:
      contents: read
      packages: write
    with:
      image: site
      context: apps/site
      push: ${{ github.event_name != 'pull_request' }}

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/bump-tag.yml
    permissions:
      contents: write
    with:
      app: site
      kustomization: k8s/apps/site/kustomization.yaml
