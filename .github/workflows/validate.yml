# Validate configuration and manifests before they reach the cluster (step H of config-not-code).
#   - site-settings.yaml: schema, consistency, matches this repository (scripts/validate-config.py)
#   - every k8s/ folder renders like Flux, strict substitution (scripts/render-k8s.py)
#   - rendered manifests are valid Kubernetes (kubeconform; CRDs from the datree catalog)
#   - SLO alert rules behave as intended (scripts/test-slo-rules.sh: fake traffic in, expected alerts out)
#   - every Ansible playbook parses (syntax check)
#   - no secret anywhere in the git history (gitleaks; false positives in .gitleaks.toml)
# A failure here blocks a PR; on main it marks the commit red (Flux would hit the same error).
name: validate

on:
  # Every PR (no path filter): these jobs are REQUIRED checks for merging into main (repository
  # ruleset), and a required check that never runs would block the PR forever.
  pull_request:
  push:
    branches: [main]
    paths: ["k8s/**", "clusters/**", "ansible/**", "scripts/**", ".github/workflows/validate.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  CLUSTER: homelab
  FLUX_VERSION: 2.10.0          # same as the cluster (ansible/group_vars/all.yml)
  KUBECONFORM_VERSION: v0.8.0
  GITLEAKS_VERSION: 8.30.1
  ANSIBLE_VERSION: 9.2.0         # = Ubuntu 24.04 apt package on node-workstation (core 2.16)

jobs:
  config-and-manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Python YAML
        run: python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml

      - name: Site settings (schema, consistency, this repository)
        run: python3 scripts/validate-config.py "$CLUSTER"

      - name: Install flux CLI and kubeconform (pinned, checksums verified)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin" && cd "$RUNNER_TEMP"
          f="flux_${FLUX_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/$f"
          curl -sSfL "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_checksums.txt" | grep " $f\$" | sha256sum -c -
          tar -xzf "$f" -C bin flux
          k="kubeconform-linux-amd64.tar.gz"
          curl -sSfLO "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/$k"
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/CHECKSUMS" | grep " $k\$" | sha256sum -c -
          tar -xzf "$k" -C bin kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Render k8s/ like Flux (strict substitution)
        run: python3 scripts/render-k8s.py "$CLUSTER" > "$RUNNER_TEMP/rendered.yaml"

      - name: SLO alert rules unit tests (vmalert-tool)
        run: scripts/test-slo-rules.sh

      # node-workstation's link switch (Wi-Fi <-> Ethernet, confirm or roll back) against a fake nmcli
      - name: net-static.sh tests (fake NetworkManager)
        run: scripts/test-net-static.sh

      - name: Kubernetes schemas (kubeconform)
        run: |
          kubeconform -summary -output text \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            "$RUNNER_TEMP/rendered.yaml"

  ansible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The SAME version node-workstation runs (Ubuntu 24.04's apt package: ansible 9.2.0 = core 2.16):
      # a playbook that only works on a newer Ansible must fail here, not on the workstation.
      - name: Install Ansible (as on node-workstation)
        # --force: the runner image already has a (newer) Ansible, which pipx would otherwise keep
        run: |
          pipx install --force --include-deps "ansible==${ANSIBLE_VERSION}"
          v="$(pipx runpip ansible show ansible | sed -n 's/^Version: //p')"
          [ "$v" = "$ANSIBLE_VERSION" ] || { echo "expected ansible $ANSIBLE_VERSION, got $v" >&2; exit 1; }
          ansible --version | head -1

      # Loads every task (catches bad YAML, unknown modules, unparsable shell text). Any failure
      # fails the job: before 2026-11-18 a `cmd && echo ok` loop silently ignored failures.
      - name: Syntax check + task loading, every playbook
        working-directory: ansible
        env:
          ANSIBLE_BECOME_ASK_PASS: "false"
          ANSIBLE_LOG_PATH: /dev/null
        run: |
          set -euo pipefail
          ansible --version | head -1
          failed=0
          for f in playbooks/*.yml; do
            if ansible-playbook "$f" --syntax-check > /dev/null && ansible-playbook "$f" --list-tasks > /dev/null; then
              echo "ok   $f"
            else
              echo "FAIL $f"; failed=1
            fi
          done
          exit $failed

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # the whole history, not only the last commit

      - name: Install gitleaks (pinned, checksum verified)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $f\$" | sha256sum -c -
          tar -xzf "$f" gitleaks && echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the git history for secrets
        run: gitleaks git --no-banner --redact --config .gitleaks.toml .
