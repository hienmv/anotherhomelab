# Reusable: build one app image for linux/arm64 (the Pis) and linux/amd64 (node-workstation), run the tests
# inside the Docker build,
# and push it to GHCR as sha-<7> and main. Called by the per-app workflows.
name: build-image

on:
  workflow_call:
    inputs:
      image:
        description: Image name under ghcr.io/hienmv/ (e.g. ticketlite-backend)
        required: true
        type: string
      context:
        description: Docker build context (folder with the Dockerfile)
        required: true
        type: string
      push:
        description: Push to GHCR (false on pull requests)
        required: true
        type: boolean

jobs:
  build:
    name: ${{ inputs.image }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Build stages run natively on amd64 (--platform=$BUILDPLATFORM), once for both platforms;
      # QEMU only covers the arm64 runtime stage, which has no RUN steps.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/hienmv/${{ inputs.image }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}

      - name: Build, test${{ inputs.push && ' and push' || '' }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}
